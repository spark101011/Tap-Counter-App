<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tap Counters</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#333333">
<link rel="apple-touch-icon" href="icon.png">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 16px 100px;
    background: #f4f4f4;
    font-family: sans-serif;
    min-height: 100vh;
  }
  h1 {
    text-align: center;
    font-size: 22px;
    margin-bottom: 20px;
  }
  #list {
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 420px;
    margin: 0 auto;
  }
  .topbar {
    max-width: 420px;
    margin: 0 auto 16px;
    display: flex;
    gap: 8px;
  }
  #search {
    flex: 1;
    padding: 10px 12px;
    font-size: 15px;
    border: 2px solid #ccc;
    border-radius: 8px;
  }
  #exportBtn, #rawDataBtn {
    padding: 10px 14px;
    font-size: 14px;
    border: none;
    border-radius: 8px;
    background: #333;
    color: white;
    white-space: nowrap;
  }
  .add-row {
    max-width: 420px;
    margin: 0 auto 16px;
    display: flex;
    gap: 8px;
  }
  #newName {
    flex: 1;
    padding: 10px 12px;
    font-size: 15px;
    border: 2px solid #ccc;
    border-radius: 8px;
  }
  #confirmAddBtn {
    padding: 10px 16px;
    font-size: 14px;
    border: none;
    border-radius: 8px;
    background: #2b7a2b;
    color: white;
  }
  .label-input {
    font-size: 18px;
    font-weight: 600;
    flex: 1;
    border: none;
    border-bottom: 2px solid #ccc;
    background: transparent;
    padding: 2px 0;
    min-width: 0;
  }
  .card {
    background: white;
    border: 2px solid #444;
    border-radius: 12px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 6px rgba(0,0,0,0.12);
  }
  .label {
    font-size: 18px;
    font-weight: 600;
    flex: 1;
    word-break: break-word;
  }
  .count {
    font-size: 34px;
    font-weight: bold;
    min-width: 60px;
    text-align: center;
    user-select: none;
  }
  .actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-left: 10px;
  }
  .actions button {
    border: none;
    background: #eee;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12px;
  }
  .count-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .minus-btn {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 2px solid #999;
    background: #fff;
    font-size: 20px;
    line-height: 1;
    color: #666;
  }
  .fab {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #333;
    color: white;
    border: none;
    border-radius: 30px;
    padding: 14px 26px;
    font-size: 16px;
  }
  #rawDataPanel {
    display: none;
    max-width: 420px;
    margin: 0 auto 100px;
    background: white;
    border: 2px solid #444;
    border-radius: 12px;
    padding: 16px;
  }
  #rawDataPanel table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-top: 10px;
  }
  #rawDataPanel th, #rawDataPanel td {
    text-align: left;
    padding: 4px 6px;
    border-bottom: 1px solid #eee;
  }
  #rawDataPanel h2 {
    font-size: 16px;
    margin: 14px 0 4px;
  }
</style>
</head>
<body>
  <h1>Tap Counters</h1>
  <div class="topbar">
    <input id="search" type="text" placeholder="Search..." oninput="render()">
    <button id="exportBtn" onclick="exportData()">Export CSV</button>
    <button id="rawDataBtn" onclick="toggleRawData()">Raw Data</button>
  </div>
  <div class="add-row">
    <input id="newName" type="text" placeholder="New counter name (e.g. Maestro)" onkeydown="if(event.key==='Enter') addBox()">
    <button id="confirmAddBtn" onclick="addBox()">Add</button>
  </div>
  <div id="rawDataPanel"></div>
  <div id="list"></div>

<script>
  let boxes = JSON.parse(localStorage.getItem('tapCounters') || '[]');
  if (boxes.length === 0) {
    boxes = [{ label: "Example", count: 0, timestamps: [] }];
  }
  // migrate old data that has no timestamps array
  boxes.forEach(b => { if (!b.timestamps) b.timestamps = []; });

  function save() {
    localStorage.setItem('tapCounters', JSON.stringify(boxes));
  }

  function render() {
    const list = document.getElementById('list');
    const query = document.getElementById('search').value.trim().toLowerCase();
    list.innerHTML = '';
    boxes.forEach((box, i) => {
      if (query && !box.label.toLowerCase().includes(query)) return;

      const card = document.createElement('div');
      card.className = 'card';

      const label = document.createElement('input');
      label.className = 'label-input';
      label.type = 'text';
      label.value = box.label;
      label.onchange = () => {
        if (label.value.trim()) {
          box.label = label.value.trim();
          save();
        } else {
          label.value = box.label; // don't allow blank name
        }
      };

      const countGroup = document.createElement('div');
      countGroup.className = 'count-group';

      const minusBtn = document.createElement('button');
      minusBtn.className = 'minus-btn';
      minusBtn.textContent = '−';
      minusBtn.onclick = () => {
        if (box.count > 0) {
          box.count--;
          box.timestamps.pop(); // undo removes the most recent tap
          save(); render();
        }
      };

      const count = document.createElement('div');
      count.className = 'count';
      count.textContent = box.count;
      count.onclick = () => {
        box.count++;
        box.timestamps.push(new Date().toISOString());
        save(); render();
      };

      countGroup.appendChild(minusBtn);
      countGroup.appendChild(count);

      const actions = document.createElement('div');
      actions.className = 'actions';

      const resetBtn = document.createElement('button');
      resetBtn.textContent = 'Reset';
      resetBtn.onclick = () => { box.count = 0; box.timestamps = []; save(); render(); };

      const delBtn = document.createElement('button');
      delBtn.textContent = 'Delete';
      delBtn.onclick = () => { boxes.splice(i, 1); save(); render(); };

      actions.appendChild(resetBtn);
      actions.appendChild(delBtn);

      card.appendChild(label);
      card.appendChild(countGroup);
      card.appendChild(actions);
      list.appendChild(card);
    });
    if (document.getElementById('rawDataPanel').style.display === 'block') {
      renderRawData();
    }
  }

  function addBox() {
    const input = document.getElementById('newName');
    const name = input.value.trim();
    if (name) {
      boxes.push({ label: name, count: 0, timestamps: [] });
      save();
      input.value = '';
      render();
    }
  }

  function exportData() {
    // Long format: one row per tap, good for frequency/timing analysis
    let rows = [['label', 'timestamp']];
    boxes.forEach(box => {
      if (box.timestamps.length === 0) {
        rows.push([box.label, '']); // still list counters with 0 taps
      } else {
        box.timestamps.forEach(ts => rows.push([box.label, ts]));
      }
    });
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'tap-counters-' + new Date().toISOString().slice(0,10) + '.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

  function toggleRawData() {
    const panel = document.getElementById('rawDataPanel');
    panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
    if (panel.style.display === 'block') renderRawData();
  }

  function renderRawData() {
    const panel = document.getElementById('rawDataPanel');
    // Build long-format rows: one per tap, newest first
    let rows = [];
    boxes.forEach(box => {
      box.timestamps.forEach(ts => rows.push({ label: box.label, ts }));
    });
    rows.sort((a, b) => new Date(b.ts) - new Date(a.ts));

    let html = '<h2>Summary (totals per counter)</h2><table><tr><th>Counter</th><th>Total taps</th></tr>';
    boxes.forEach(box => {
      html += `<tr><td>${box.label}</td><td>${box.count}</td></tr>`;
    });
    html += '</table>';

    html += '<h2>Raw log (every tap, newest first)</h2>';
    if (rows.length === 0) {
      html += '<p>No taps recorded yet.</p>';
    } else {
      html += '<table><tr><th>Counter</th><th>Time</th></tr>';
      rows.forEach(r => {
        html += `<tr><td>${r.label}</td><td>${new Date(r.ts).toLocaleString()}</td></tr>`;
      });
      html += '</table>';
    }
    panel.innerHTML = html;
  }

  render();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
