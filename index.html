<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Tools</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#060b10">
<link rel="apple-touch-icon" href="icon.png">
<style>
  :root {
    --bg-0: #060b10;
    --bg-1: #0a141d;
    --glass: rgba(255,255,255,0.055);
    --glass-hi: rgba(255,255,255,0.09);
    --glass-border: rgba(148,197,190,0.16);
    --glass-border-strong: rgba(148,197,190,0.28);
    --blue: #4fb4ff;
    --blue-soft: #2e6fa8;
    --green: #3ddc97;
    --green-soft: #1f9e6f;
    --text: #eaf3f2;
    --text-dim: #93a8ac;
    --text-faint: #64787c;
    --danger: #ff6b6b;
    --danger-soft: rgba(255,107,107,0.16);
    --warn: #f5b95c;
    --shadow: 0 8px 32px rgba(0,0,0,0.45);
    --radius: 18px;
  }
  /* --- Bottom tab bar --- */
  .bt-tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 900;
    display: flex; justify-content: space-around; align-items: center;
    padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
    background: rgba(10,20,29,0.85);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--glass-border);
  }
  .bt-tabbar button {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    background: none; border: none; color: var(--text-dim); font-size: 10px; padding: 6px 2px;
  }
  .bt-tabbar button .ic { font-size: 19px; line-height: 1; }
  .bt-tabbar button.active { color: var(--green); }

  /* --- Bento home grid --- */
  .bt-bento { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 460px; margin: 0 auto 16px; }
  .bt-bento-big { grid-column: 1 / -1; }
  .bt-bento-tile {
    background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border); border-radius: var(--radius); padding: 16px;
    text-align: left; color: var(--text); box-shadow: var(--shadow);
  }
  .bt-bento-tile .tile-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  .bt-bento-tile .tile-sub { font-size: 12px; color: var(--text-dim); }

  /* --- Accordion sections --- */
  .bt-accordion-header {
    display: flex; justify-content: space-between; align-items: center; width: 100%;
    background: var(--glass); border: 1px solid var(--glass-border); border-radius: 14px;
    padding: 12px 16px; margin-bottom: 8px; color: var(--text); font-size: 15px; font-weight: 700;
  }
  .bt-accordion-header .chev { font-size: 12px; color: var(--text-dim); transition: transform 0.15s; }
  .bt-accordion-body { margin-bottom: 12px; }

  /* --- Traffic-light tone utility --- */
  .tone-good { color: var(--green) !important; }
  .tone-warn { color: var(--danger) !important; }
  .tone-caution { color: var(--warn) !important; }
  .bt-metric-box.tone-good { border-color: rgba(61,220,151,0.4); }
  .bt-metric-box.tone-warn { border-color: rgba(255,107,107,0.4); }
  .bt-metric-box.tone-caution { border-color: rgba(245,185,92,0.4); }

  /* --- Hero stat (dominant number per card) --- */
  .bt-hero { text-align: center; margin-bottom: 10px; }
  .bt-hero .hv { font-size: 40px; font-weight: 800; line-height: 1; }
  .bt-hero .hl { font-size: 12px; color: var(--text-dim); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.04em; }

  /* --- Data Bank --- */
  .db-icon-row { display: flex; gap: 10px; max-width: 460px; margin: 0 auto 16px; align-items: stretch; }
  .db-add-big {
    flex: 1; background: linear-gradient(135deg, #1d4ed8, #10b981); color: white; border: none;
    border-radius: 16px; padding: 18px; font-size: 16px; font-weight: 700; box-shadow: var(--shadow);
  }
  .db-icon-btn {
    width: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    background: var(--glass); border: 1px solid var(--glass-border); border-radius: 14px; color: var(--text);
    font-size: 10px;
  }
  .db-icon-btn .ic { font-size: 20px; }
  .db-streak {
    max-width: 460px; margin: 0 auto 14px; text-align: center; font-size: 13px; color: var(--text-dim);
    background: var(--glass); border: 1px solid var(--glass-border); border-radius: 12px; padding: 8px;
  }
  .db-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .db-cal-cell {
    aspect-ratio: 1; border: 1px solid var(--glass-border); border-radius: 8px; background: rgba(255,255,255,0.03);
    display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; color: var(--text-dim);
  }
  .db-cal-cell.has-entries { background: rgba(56,189,248,0.15); color: var(--text); font-weight: 600; }
  .db-cal-cell.today { border-color: var(--green); }
  .db-cal-cell .n { font-size: 9px; color: var(--green); }
  .db-tag-suggest { font-size: 11px; color: var(--text-dim); margin: -4px 0 8px; }
  * { box-sizing: border-box; }
  html { background: var(--bg-0); }
  body {
    margin: 0;
    padding: 22px 16px 110px;
    background:
      radial-gradient(720px 480px at 8% -6%, rgba(61,220,151,0.16), transparent 60%),
      radial-gradient(760px 520px at 96% 8%, rgba(79,180,255,0.14), transparent 55%),
      radial-gradient(900px 700px at 50% 110%, rgba(45,120,150,0.10), transparent 60%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1) 60%, var(--bg-0));
    background-attachment: fixed;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  h1 { text-align: center; font-size: 21px; margin-bottom: 20px; font-weight: 650; letter-spacing: 0.2px; color: var(--text); }
  .page { display: none; }
  .page.active { display: block; }

  /* --- Glass panel base, applied to every card-like surface --- */
  .card, .group, #rawDataPanel, #best, #historyPanel, .session-card,
  .bt-card, .bt-edit-panel, .bt-hyp-card, .bt-compare-col, .bt-metric-box,
  #page-home .menu-btn {
    background: linear-gradient(160deg, var(--glass-hi), var(--glass));
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid var(--glass-border);
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.05);
  }

  /* --- Home menu --- */
  #page-home .menu-btn {
    display: block;
    width: 100%;
    max-width: 420px;
    margin: 0 auto 16px;
    padding: 22px;
    font-size: 18px;
    font-weight: 600;
    border-radius: var(--radius);
    text-align: left;
    color: var(--text);
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  #page-home .menu-btn:active { transform: scale(0.98); border-color: var(--glass-border-strong); }
  #page-home .menu-btn .sub { display: block; font-size: 13px; font-weight: normal; color: var(--text-dim); margin-top: 4px; }

  /* --- Top nav on each tool page --- */
  .toolnav { max-width: 460px; margin: 0 auto 16px; display: flex; align-items: center; gap: 10px; }
  .home-btn { border: 1px solid var(--glass-border); background: rgba(255,255,255,0.06); color: var(--text); border-radius: 10px; padding: 8px 12px; font-size: 14px; white-space: nowrap; backdrop-filter: blur(10px); }
  .toolnav h1 { margin: 0; font-size: 18px; flex: 1; }

  /* --- Shared bits --- */
  #list { display: flex; flex-direction: column; gap: 14px; max-width: 420px; margin: 0 auto; }
  .topbar { max-width: 420px; margin: 0 auto 16px; display: flex; gap: 8px; }
  #search { flex: 1; padding: 10px 12px; font-size: 15px; border: 1px solid var(--glass-border); border-radius: 10px; background: rgba(255,255,255,0.05); color: var(--text); }
  #search::placeholder { color: var(--text-faint); }
  #exportBtn, #rawDataBtn { padding: 10px 14px; font-size: 14px; border: none; border-radius: 10px; background: linear-gradient(135deg, var(--blue-soft), var(--blue)); color: #04121a; font-weight: 600; white-space: nowrap; }
  .add-row { max-width: 420px; margin: 0 auto 16px; display: flex; gap: 8px; }
  #newName { flex: 1; padding: 10px 12px; font-size: 15px; border: 1px solid var(--glass-border); border-radius: 10px; background: rgba(255,255,255,0.05); color: var(--text); }
  #confirmAddBtn { padding: 10px 16px; font-size: 14px; border: none; border-radius: 10px; background: linear-gradient(135deg, var(--green-soft), var(--green)); color: #052015; font-weight: 700; }
  .label-input { font-size: 18px; font-weight: 600; flex: 1; border: none; border-bottom: 2px solid var(--glass-border); background: transparent; padding: 2px 0; min-width: 0; color: var(--text); }
  .card { border-radius: var(--radius); padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; }
  .label { font-size: 18px; font-weight: 600; flex: 1; word-break: break-word; color: var(--text); }
  .count { font-size: 34px; font-weight: bold; min-width: 60px; text-align: center; user-select: none; color: var(--blue); }
  .actions { display: flex; flex-direction: column; gap: 6px; margin-left: 10px; }
  .actions button { border: 1px solid var(--glass-border); background: rgba(255,255,255,0.06); color: var(--text-dim); border-radius: 6px; padding: 4px 8px; font-size: 12px; }
  .count-group { display: flex; align-items: center; gap: 8px; }
  .minus-btn { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--glass-border-strong); background: rgba(255,255,255,0.06); font-size: 20px; line-height: 1; color: var(--text-dim); }
  #rawDataPanel { display: none; max-width: 420px; margin: 0 auto 100px; border-radius: var(--radius); padding: 16px; }
  #rawDataPanel table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  #rawDataPanel th, #rawDataPanel td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--glass-border); color: var(--text-dim); }
  #rawDataPanel h2 { font-size: 16px; margin: 14px 0 4px; color: var(--text); }

  /* --- Odds tracker specific --- */
  .subtitle { text-align: center; color: var(--text-dim); font-size: 13px; margin-bottom: 20px; }
  .bar-row { max-width: 460px; margin: 0 auto 12px; display: flex; gap: 8px; }
  .btn { border: none; border-radius: 10px; padding: 10px 14px; font-size: 14px; color: #04141c; font-weight: 600; white-space: nowrap; }
  .btn-add { background: linear-gradient(135deg, var(--blue-soft), var(--blue)); }
  .btn-save { background: linear-gradient(135deg, var(--green-soft), var(--green)); }
  .btn-history { background: rgba(255,255,255,0.07); color: var(--text); border: 1px solid var(--glass-border); flex: 1; }
  #best { max-width: 460px; margin: 0 auto 16px; border-radius: 14px; padding: 10px 14px; text-align: center; font-weight: 600; font-size: 14px; border-color: rgba(245,185,92,0.35); color: var(--warn); }
  #groups { display: flex; flex-direction: column; gap: 12px; max-width: 460px; margin: 0 auto; }
  .group { border-radius: var(--radius); padding: 14px 16px; }
  .group-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
  .group-title { font-size: 18px; font-weight: bold; border: none; border-bottom: 2px solid var(--glass-border); background: transparent; flex: 1; min-width: 0; padding: 2px 0; color: var(--text); }
  .winrate { font-size: 16px; font-weight: bold; white-space: nowrap; color: var(--green); }
  .stats { font-size: 13px; color: var(--text-dim); }
  .taps { display: flex; gap: 10px; margin-top: 10px; }
  .tap-btn { flex: 1; padding: 14px 0; font-size: 16px; font-weight: bold; border: none; border-radius: 10px; color: #04141c; }
  .win-btn { background: linear-gradient(135deg, var(--green-soft), var(--green)); }
  .loss-btn { background: linear-gradient(135deg, #a83f3f, var(--danger)); color: #1a0505; }
  .bottom-row { display: flex; gap: 8px; margin-top: 8px; }
  .undo-btn, .del-btn { flex: 1; padding: 6px; font-size: 12px; border: 1px solid var(--glass-border); border-radius: 8px; background: rgba(255,255,255,0.05); color: var(--text-dim); }
  #historyPanel { display: none; max-width: 460px; margin: 18px auto 0; border-radius: var(--radius); padding: 14px; }
  #historyPanel h2 { font-size: 16px; margin: 0 0 10px; color: var(--text); }
  .session-card { border-radius: 12px; padding: 10px; margin-bottom: 10px; font-size: 13px; border: 1px solid var(--glass-border); }
  .session-card table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  .session-card th, .session-card td { text-align: left; padding: 2px 4px; color: var(--text-dim); }
  .del-session { background: rgba(255,107,107,0.14); color: var(--danger); border: 1px solid rgba(255,107,107,0.3); border-radius: 6px; padding: 3px 8px; font-size: 11px; float: right; }

  /* --- Backtest Research module --- */
  #btApp { max-width: 460px; margin: 0 auto; }
  .bt-card { border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
  .bt-card h3 { margin: 0 0 8px; font-size: 17px; color: var(--text); font-weight: 650; }
  .bt-card .meta { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
  .bt-row-btns { display: flex; gap: 8px; margin-top: 8px; }
  .bt-row-btns button { flex: 1; padding: 8px; font-size: 13px; border: 1px solid var(--glass-border); border-radius: 8px; background: rgba(255,255,255,0.06); color: var(--text); }
  .bt-btn-primary { background: linear-gradient(135deg, var(--blue-soft), var(--blue)) !important; border: none !important; color: #04141c !important; font-weight: 700; }
  .bt-btn-danger { background: linear-gradient(135deg, #a83f3f, var(--danger)) !important; border: none !important; color: #1a0505 !important; font-weight: 700; }
  .bt-input, .bt-select, .bt-textarea {
    width: 100%; padding: 9px 10px; font-size: 14px; border: 1px solid var(--glass-border);
    border-radius: 10px; margin-bottom: 8px; background: rgba(255,255,255,0.05); color: var(--text);
  }
  .bt-input::placeholder, .bt-textarea::placeholder { color: var(--text-faint); }
  .bt-select { color-scheme: dark; }
  .bt-textarea { min-height: 60px; resize: vertical; }
  .bt-field-label { font-size: 12px; font-weight: 600; color: var(--text-dim); margin: 6px 0 2px; display: block; letter-spacing: 0.2px; }
  .bt-pill-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .bt-pill { border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); color: var(--text-dim); border-radius: 20px; padding: 6px 12px; font-size: 12px; }
  .bt-pill.on { background: linear-gradient(135deg, var(--green-soft), var(--blue-soft)); color: #eaf9f4; border-color: transparent; }
  .bt-tab-row { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; }
  .bt-tab { flex: 0 0 auto; padding: 8px 12px; border: 1px solid var(--glass-border); border-radius: 10px; background: rgba(255,255,255,0.05); color: var(--text-dim); font-size: 12px; white-space: nowrap; }
  .bt-tab.on { background: linear-gradient(135deg, var(--blue-soft), var(--blue)); color: #04141c; border-color: transparent; font-weight: 700; }
  .bt-frozen-badge { display: inline-block; background: linear-gradient(135deg, #d99a3d, var(--warn)); color: #2a1a02; font-size: 11px; font-weight: bold; padding: 2px 8px; border-radius: 10px; margin-left: 6px; }
  .bt-metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
  .bt-metric-box { border-radius: 12px; padding: 10px; text-align: center; }
  .bt-metric-box .v { font-size: 18px; font-weight: bold; color: var(--text); }
  .bt-metric-box .l { font-size: 11px; color: var(--text-dim); }
  .bt-trade-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 4px; border-bottom: 1px solid var(--glass-border); font-size: 13px; color: var(--text); }
  .bt-trade-row .r-pos { color: var(--green); font-weight: bold; }
  .bt-trade-row .r-neg { color: var(--danger); font-weight: bold; }
  .bt-trade-row .r-zero { color: var(--text-faint); font-weight: bold; }
  .bt-edit-panel { border-radius: 12px; padding: 10px; margin-top: 6px; }
  .bt-seq { font-family: ui-monospace, "SF Mono", monospace; font-size: 13px; word-break: break-all; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); padding: 8px; border-radius: 8px; color: var(--text-dim); }
  .bt-warn { background: rgba(245,185,92,0.10); border: 1px solid rgba(245,185,92,0.35); border-radius: 10px; padding: 10px; font-size: 13px; margin-bottom: 10px; color: var(--warn); }
  .bt-note { font-size: 12px; color: var(--text-dim); margin: 4px 0 10px; }
  .bt-compare-cols { display: flex; gap: 10px; }
  .bt-compare-col { border-radius: 12px; padding: 10px; }
  .bt-compare-col h4 { margin: 0 0 8px; font-size: 13px; text-align: center; color: var(--text); }
  .bt-compare-col .m { font-size: 12px; display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid var(--glass-border); color: var(--text-dim); }
  .bt-hyp-card { border-radius: 12px; padding: 10px; margin-bottom: 8px; font-size: 13px; }
  .bt-hyp-status { display: inline-block; font-size: 11px; font-weight: bold; padding: 2px 8px; border-radius: 10px; background: rgba(79,180,255,0.16); color: var(--blue); }

  /* --- Tappable field preview (opens fullscreen editor) --- */
  .bt-field-preview {
    width: 100%; text-align: left; padding: 12px 14px; font-size: 14px; border-radius: 10px; margin-bottom: 8px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(148,255,210,0.25); color: #eafff5;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block;
  }
  .bt-field-preview.empty { color: #9fd7c4; font-style: italic; }
  .bt-field-preview .tap-hint { float: right; color: #7dd3fc; font-size: 11px; }

  /* --- Fullscreen editor --- */
  .bt-fs-overlay {
    position: fixed; inset: 0; z-index: 1000;
    background: radial-gradient(circle at 15% 0%, #12233b 0%, #0a0f1a 45%, #060a12 100%);
    display: flex; flex-direction: column; padding: 16px;
  }
  .bt-fs-topbar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .bt-fs-label { font-size: 16px; font-weight: 600; color: #eafff5; }
  .bt-fs-textarea, .bt-fs-readonly {
    flex: 1; width: 100%; font-size: 17px; line-height: 1.5; padding: 14px;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(148,255,210,0.25); border-radius: 12px;
    color: #eafff5; resize: none; overflow-y: auto; white-space: pre-wrap;
  }
</style>

</head>
<body>

  <!-- HOME MENU -->
  <div id="page-home" class="page active">
    <h1>Data Tools</h1>
    <div id="btDashboard"></div>
  </div>

  <!-- TAP COUNTERS PAGE -->
  <div id="page-counters" class="page">
    <div class="toolnav">
      <button class="home-btn" onclick="showPage('home')">☰ Menu</button>
      <h1>Tap Counters</h1>
    </div>
    <div class="topbar">
      <input id="search" type="text" placeholder="Search..." oninput="counter_render()">
      <button id="exportBtn" onclick="counter_exportData()">Export CSV</button>
      <button id="rawDataBtn" onclick="counter_toggleRawData()">Raw Data</button>
    </div>
    <div class="add-row">
      <input id="newName" type="text" placeholder="New counter name (e.g. Maestro)" onkeydown="if(event.key==='Enter') counter_addBox()">
      <button id="confirmAddBtn" onclick="counter_addBox()">Add</button>
    </div>
    <div id="rawDataPanel"></div>
    <div id="list"></div>
  </div>

  <!-- ODDS TRACKER PAGE -->
  <div id="page-odds" class="page">
    <div class="toolnav">
      <button class="home-btn" onclick="showPage('home')">☰ Menu</button>
      <h1>Odds Win-Rate Tracker</h1>
    </div>
    <div class="subtitle">Add your own bars, tap Win or Loss as results come in</div>
    <div class="bar-row">
      <input id="newBarName" type="text" placeholder="New bar name (e.g. 3:1)" onkeydown="if(event.key==='Enter') odds_addBar()">
      <button class="btn btn-add" onclick="odds_addBar()">Add Bar</button>
    </div>
    <div class="bar-row">
      <input id="sessionName" type="text" placeholder="Current strategy name (optional)">
      <button class="btn btn-save" onclick="odds_saveAndReset()">Save & New</button>
    </div>
    <div class="bar-row">
      <button class="btn btn-history" onclick="odds_toggleHistory()">View Saved Sessions</button>
    </div>
    <div id="best"></div>
    <div id="groups"></div>
    <div id="historyPanel"></div>
  </div>

  <!-- BACKTEST RESEARCH PAGE -->
  <div id="page-backtest" class="page">
    <div class="toolnav">
      <button class="home-btn" onclick="showPage('home')">☰ Menu</button>
      <h1 id="btTitle">Backtest Research</h1>
    </div>
    <div id="btApp"></div>
  </div>

  <!-- STRATEGY DEVELOPMENT PAGE -->
  <div id="page-develop" class="page">
    <div class="toolnav">
      <button class="home-btn" onclick="showPage('home')">☰ Menu</button>
      <h1>Strategy Development</h1>
    </div>
    <div id="devApp"></div>
  </div>

  <!-- DATA BANK PAGE -->
  <div id="page-databank" class="page">
    <div class="toolnav">
      <button class="home-btn" onclick="showPage('home')">☰ Menu</button>
      <h1>Data Bank</h1>
    </div>
    <div id="dbApp"></div>
  </div>

  <!-- BOTTOM TAB BAR -->
  <div class="bt-tabbar">
    <button id="tab-home" class="active" onclick="showPage('home')"><span class="ic">🏠</span>Home</button>
    <button id="tab-counters" onclick="showPage('counters')"><span class="ic">#️⃣</span>Counters</button>
    <button id="tab-odds" onclick="showPage('odds')"><span class="ic">🎯</span>Odds</button>
    <button id="tab-backtest" onclick="showPage('backtest')"><span class="ic">📈</span>Backtest</button>
    <button id="tab-develop" onclick="showPage('develop')"><span class="ic">🧪</span>Develop</button>
    <button id="tab-databank" onclick="showPage('databank')"><span class="ic">🏦</span>Bank</button>
  </div>

  <!-- FULLSCREEN FIELD EDITOR -->
  <div id="btFsOverlay" class="bt-fs-overlay" style="display:none;">
    <div class="bt-fs-topbar">
      <button class="home-btn" onclick="bt_closeFieldEditor()">← Back</button>
      <span id="btFsLabel" class="bt-fs-label"></span>
    </div>
    <textarea id="btFsTextarea" class="bt-fs-textarea"></textarea>
    <div id="btFsReadonly" class="bt-fs-readonly" style="display:none;"></div>
  </div>

<script>
  // ============ NAVIGATION ============
  function showPage(name) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    document.querySelectorAll('.bt-tabbar button').forEach(b => b.classList.remove('active'));
    const tabBtn = document.getElementById('tab-' + name);
    if (tabBtn) tabBtn.classList.add('active');
    if (name === 'counters') counter_render();
    if (name === 'odds') odds_render();
    if (name === 'backtest') bt_render();
    if (name === 'develop') dev_render();
    if (name === 'databank') db_render();
    if (name === 'home') bt_renderDashboard();
  }

  // ============ TAP COUNTERS ============
  let boxes = JSON.parse(localStorage.getItem('tapCounters') || '[]');
  if (boxes.length === 0) {
    boxes = [{ label: "Example", count: 0, timestamps: [] }];
  }
  boxes.forEach(b => { if (!b.timestamps) b.timestamps = []; });

  function counter_save() {
    localStorage.setItem('tapCounters', JSON.stringify(boxes));
  }

  function counter_render() {
    const list = document.getElementById('list');
    const query = document.getElementById('search').value.trim().toLowerCase();
    list.innerHTML = '';
    boxes.forEach((box, i) => {
      if (query && !box.label.toLowerCase().includes(query)) return;

      const card = document.createElement('div');
      card.className = 'card';

      const label = document.createElement('input');
      label.className = 'label-input';
      label.type = 'text';
      label.value = box.label;
      label.onchange = () => {
        if (label.value.trim()) { box.label = label.value.trim(); counter_save(); }
        else label.value = box.label;
      };

      const countGroup = document.createElement('div');
      countGroup.className = 'count-group';

      const minusBtn = document.createElement('button');
      minusBtn.className = 'minus-btn';
      minusBtn.textContent = '−';
      minusBtn.onclick = () => {
        if (box.count > 0) { box.count--; box.timestamps.pop(); counter_save(); counter_render(); }
      };

      const count = document.createElement('div');
      count.className = 'count';
      count.textContent = box.count;
      count.onclick = () => {
        box.count++; box.timestamps.push(new Date().toISOString());
        counter_save(); counter_render();
      };

      countGroup.appendChild(minusBtn);
      countGroup.appendChild(count);

      const actions = document.createElement('div');
      actions.className = 'actions';

      const resetBtn = document.createElement('button');
      resetBtn.textContent = 'Reset';
      resetBtn.onclick = () => { box.count = 0; box.timestamps = []; counter_save(); counter_render(); };

      const delBtn = document.createElement('button');
      delBtn.textContent = 'Delete';
      delBtn.onclick = () => { boxes.splice(i, 1); counter_save(); counter_render(); };

      actions.appendChild(resetBtn);
      actions.appendChild(delBtn);

      card.appendChild(label);
      card.appendChild(countGroup);
      card.appendChild(actions);
      list.appendChild(card);
    });
    if (document.getElementById('rawDataPanel').style.display === 'block') counter_renderRawData();
  }

  function counter_addBox() {
    const input = document.getElementById('newName');
    const name = input.value.trim();
    if (name) {
      boxes.push({ label: name, count: 0, timestamps: [] });
      counter_save(); input.value = ''; counter_render();
    }
  }

  function counter_exportData() {
    let rows = [['label', 'timestamp']];
    boxes.forEach(box => {
      if (box.timestamps.length === 0) rows.push([box.label, '']);
      else box.timestamps.forEach(ts => rows.push([box.label, ts]));
    });
    const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'tap-counters-' + new Date().toISOString().slice(0,10) + '.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

  function counter_toggleRawData() {
    const panel = document.getElementById('rawDataPanel');
    panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
    if (panel.style.display === 'block') counter_renderRawData();
  }

  function counter_renderRawData() {
    const panel = document.getElementById('rawDataPanel');
    let rows = [];
    boxes.forEach(box => box.timestamps.forEach(ts => rows.push({ label: box.label, ts })));
    rows.sort((a, b) => new Date(b.ts) - new Date(a.ts));

    let html = '<h2>Summary (totals per counter)</h2><table><tr><th>Counter</th><th>Total taps</th></tr>';
    boxes.forEach(box => { html += `<tr><td>${box.label}</td><td>${box.count}</td></tr>`; });
    html += '</table>';

    html += '<h2>Raw log (every tap, newest first)</h2>';
    if (rows.length === 0) {
      html += '<p>No taps recorded yet.</p>';
    } else {
      html += '<table><tr><th>Counter</th><th>Time</th></tr>';
      rows.forEach(r => { html += `<tr><td>${r.label}</td><td>${new Date(r.ts).toLocaleString()}</td></tr>`; });
      html += '</table>';
    }
    panel.innerHTML = html;
  }

  // ============ ODDS TRACKER ============
  function odds_defaultBars() {
    return [
      { label: "4:1", wins: 0, losses: 0, lastAction: null },
      { label: "8:1", wins: 0, losses: 0, lastAction: null }
    ];
  }

  let odds_current = JSON.parse(localStorage.getItem('oddsCurrentBars') || 'null') || odds_defaultBars();
  let odds_history = JSON.parse(localStorage.getItem('oddsHistory') || '[]');

  function odds_saveCurrent() { localStorage.setItem('oddsCurrentBars', JSON.stringify(odds_current)); }
  function odds_saveHistory() { localStorage.setItem('oddsHistory', JSON.stringify(odds_history)); }

  function odds_winRate(g) {
    const total = g.wins + g.losses;
    return total === 0 ? null : (g.wins / total * 100);
  }

  function odds_addBar() {
    const input = document.getElementById('newBarName');
    const name = input.value.trim();
    if (name) {
      odds_current.push({ label: name, wins: 0, losses: 0, lastAction: null });
      odds_saveCurrent(); input.value = ''; odds_render();
    }
  }

  function odds_render() {
    const container = document.getElementById('groups');
    container.innerHTML = '';

    let best = null;
    odds_current.forEach(g => {
      const wr = odds_winRate(g);
      if (wr !== null && (best === null || wr > best.wr)) best = { label: g.label, wr };
    });
    document.getElementById('best').textContent = best
      ? `Best so far: ${best.label} at ${best.wr.toFixed(1)}% win rate`
      : `No results yet — start tapping`;

    odds_current.forEach((g, i) => {
      const wr = odds_winRate(g);

      const card = document.createElement('div');
      card.className = 'group';

      const top = document.createElement('div');
      top.className = 'group-top';

      const labelInput = document.createElement('input');
      labelInput.className = 'group-title';
      labelInput.type = 'text';
      labelInput.value = g.label;
      labelInput.onchange = () => {
        if (labelInput.value.trim()) { g.label = labelInput.value.trim(); odds_saveCurrent(); }
        else labelInput.value = g.label;
      };

      const wrDiv = document.createElement('div');
      wrDiv.className = 'winrate';
      wrDiv.textContent = wr === null ? '—' : wr.toFixed(1) + '%';

      top.appendChild(labelInput);
      top.appendChild(wrDiv);

      const stats = document.createElement('div');
      stats.className = 'stats';
      stats.textContent = `${g.wins} win${g.wins!==1?'s':''} \u00b7 ${g.losses} loss${g.losses!==1?'es':''} \u00b7 ${g.wins+g.losses} total`;

      const taps = document.createElement('div');
      taps.className = 'taps';

      const winBtn = document.createElement('button');
      winBtn.className = 'tap-btn win-btn';
      winBtn.textContent = 'WIN';
      winBtn.onclick = () => { g.wins++; g.lastAction='win'; odds_saveCurrent(); odds_render(); };

      const lossBtn = document.createElement('button');
      lossBtn.className = 'tap-btn loss-btn';
      lossBtn.textContent = 'LOSS';
      lossBtn.onclick = () => { g.losses++; g.lastAction='loss'; odds_saveCurrent(); odds_render(); };

      taps.appendChild(winBtn);
      taps.appendChild(lossBtn);

      const bottomRow = document.createElement('div');
      bottomRow.className = 'bottom-row';

      const undoBtn = document.createElement('button');
      undoBtn.className = 'undo-btn';
      undoBtn.textContent = 'Undo last tap';
      undoBtn.onclick = () => {
        if (g.lastAction === 'win' && g.wins > 0) g.wins--;
        if (g.lastAction === 'loss' && g.losses > 0) g.losses--;
        g.lastAction = null;
        odds_saveCurrent(); odds_render();
      };

      const delBtn = document.createElement('button');
      delBtn.className = 'del-btn';
      delBtn.textContent = 'Delete bar';
      delBtn.onclick = () => { odds_current.splice(i, 1); odds_saveCurrent(); odds_render(); };

      bottomRow.appendChild(undoBtn);
      bottomRow.appendChild(delBtn);

      card.appendChild(top);
      card.appendChild(stats);
      card.appendChild(taps);
      card.appendChild(bottomRow);
      container.appendChild(card);
    });

    if (document.getElementById('historyPanel').style.display === 'block') odds_renderHistory();
  }

  function odds_saveAndReset() {
    const totalTaps = odds_current.reduce((sum, g) => sum + g.wins + g.losses, 0);
    if (totalTaps === 0) { alert('No taps recorded yet — nothing to save.'); return; }
    const name = document.getElementById('sessionName').value.trim() || ('Strategy ' + (odds_history.length + 1));
    odds_history.push({ name, date: new Date().toISOString(), data: JSON.parse(JSON.stringify(odds_current)) });
    odds_saveHistory();
    odds_current = odds_defaultBars();
    odds_saveCurrent();
    document.getElementById('sessionName').value = '';
    odds_render();
  }

  function odds_toggleHistory() {
    const panel = document.getElementById('historyPanel');
    panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
    if (panel.style.display === 'block') odds_renderHistory();
  }

  function odds_renderHistory() {
    const panel = document.getElementById('historyPanel');
    if (odds_history.length === 0) {
      panel.innerHTML = '<h2>Saved Sessions</h2><p>No saved sessions yet.</p>';
      return;
    }
    let html = '<h2>Saved Sessions</h2>';
    odds_history.slice().reverse().forEach((sess, revIdx) => {
      const realIdx = odds_history.length - 1 - revIdx;
      html += `<div class="session-card"><button class="del-session" onclick="odds_deleteSession(${realIdx})">Delete</button>`;
      html += `<b>${sess.name}</b><br><span style="color:#888">${new Date(sess.date).toLocaleString()}</span>`;
      html += '<table><tr><th>Bar</th><th>W</th><th>L</th><th>Win%</th></tr>';
      sess.data.forEach(g => {
        const wr = odds_winRate(g);
        html += `<tr><td>${g.label}</td><td>${g.wins}</td><td>${g.losses}</td><td>${wr===null?'—':wr.toFixed(1)+'%'}</td></tr>`;
      });
      html += '</table></div>';
    });
    panel.innerHTML = html;
  }

  function odds_deleteSession(idx) {
    odds_history.splice(idx, 1);
    odds_saveHistory();
    odds_renderHistory();
  }

  // ============ BACKTEST RESEARCH MODULE ============
  let btProjects = JSON.parse(localStorage.getItem('btProjects') || '[]');
  let btTrash = JSON.parse(localStorage.getItem('btTrash') || '[]');
  let btState = { view: 'projects', projectId: null, versionId: null, dataTab: 'in-sample', tempDir: 'long', tempDataType: 'in-sample', showArchived: false, searchQuery: '', searchFilters: {} };

  function bt_saveTrash() { localStorage.setItem('btTrash', JSON.stringify(btTrash)); }

  // --- Trash / Recovery ---
  function bt_restoreTrashItem(trashId) {
    const item = btTrash.find(x => x.id === trashId);
    if (!item) return;
    if (item.type === 'project') {
      btProjects.push(item.data);
    } else if (item.type === 'version') {
      const proj = bt_findProject(item.parentProjectId);
      if (!proj) { alert('The original project no longer exists — cannot restore here.'); return; }
      proj.versions.push(item.data);
    } else if (item.type === 'trade') {
      const proj = bt_findProject(item.parentProjectId);
      const ver = proj && bt_findVersion(proj, item.parentVersionId);
      if (!ver) { alert('The original project/version no longer exists — cannot restore here.'); return; }
      ver.trades.push(item.data);
    } else if (item.type === 'liveTrade') {
      const proj = bt_findProject(item.parentProjectId);
      const ver = proj && bt_findVersion(proj, item.parentVersionId);
      if (!ver) { alert('The original project/version no longer exists — cannot restore here.'); return; }
      if (!ver.liveTrades) ver.liveTrades = [];
      ver.liveTrades.push(item.data);
    }
    btTrash = btTrash.filter(x => x.id !== trashId);
    bt_save(); bt_saveTrash();
    bt_render();
  }

  function bt_permanentlyDeleteTrashItem(trashId) {
    if (!confirm('Permanently delete this? This cannot be undone.')) return;
    btTrash = btTrash.filter(x => x.id !== trashId);
    bt_saveTrash();
    bt_render();
  }

  function bt_emptyTrash() {
    if (btTrash.length === 0) return;
    if (!confirm('Permanently delete everything in Trash? This cannot be undone.')) return;
    btTrash = [];
    bt_saveTrash();
    bt_render();
  }

  // --- Search & Filter ---
  function bt_runSearchNav() { btState.view = 'search'; bt_render(); }

  function bt_searchAll(query) {
    const q = query.trim().toLowerCase();
    let results = [];
    btProjects.forEach(proj => {
      proj.versions.forEach(ver => {
        ver.trades.forEach(t => {
          const hay = [proj.name, ver.label, t.direction, t.dataType, t.marketEnv, t.volatility, t.session, bt_tradeTags(t).join(' '), t.notes].join(' ').toLowerCase();
          if (!q || hay.includes(q)) results.push({ kind: 'Backtest Trade', proj, ver, item: t, text: `#${t.num} ${t.direction} ${bt_fmtR(t.resultR)} · ${t.date}`,
            f_type: 'backtest', f_direction: t.direction, f_result: t.resultR>0?'win':(t.resultR<0?'loss':'be'), f_dataType: t.dataType, f_rules: '' });
        });
        (ver.liveTrades||[]).forEach(t => {
          const hay = [proj.name, ver.label, t.direction, t.contextBefore, t.mistakes, t.wentWell, t.wentBadly, t.learned].join(' ').toLowerCase();
          if (!q || hay.includes(q)) results.push({ kind: 'Live Trade', proj, ver, item: t, text: `#${t.num} ${t.direction} ${bt_fmtR(t.resultR)} · ${t.date}`,
            f_type: 'live', f_direction: t.direction, f_result: t.resultR>0?'win':(t.resultR<0?'loss':'be'), f_dataType: '', f_rules: t.rulesFollowed });
        });
      });
      (proj.hypotheses||[]).forEach(h => {
        const hay = [h.observation, h.hypothesis, h.status].join(' ').toLowerCase();
        if (!q || hay.includes(q)) results.push({ kind: 'Hypothesis', proj, ver: null, item: h, text: (h.observation || h.hypothesis || '').slice(0,60),
          f_type: '', f_direction: '', f_result: '', f_dataType: '', f_rules: '' });
      });
    });
    const f = btState.searchFilters || {};
    if (f.type) results = results.filter(r => r.f_type === f.type);
    if (f.direction) results = results.filter(r => r.f_direction === f.direction);
    if (f.result) results = results.filter(r => r.f_result === f.result);
    if (f.dataType) results = results.filter(r => r.f_dataType === f.dataType);
    if (f.rules) results = results.filter(r => r.f_rules === f.rules);
    return results;
  }

  function bt_setSearchFilter(key, value) {
    if (!btState.searchFilters) btState.searchFilters = {};
    btState.searchFilters[key] = (btState.searchFilters[key] === value) ? '' : value;
    bt_render();
  }

  // --- Backup / Export ---
  function bt_downloadBackup() {
    const backup = { exportedAt: new Date().toISOString(), projects: btProjects, trash: btTrash };
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'backtest-research-backup-' + new Date().toISOString().slice(0,10) + '.json';
    a.click(); URL.revokeObjectURL(url);
  }

  function bt_restoreBackupFile(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const backup = JSON.parse(e.target.result);
        if (!backup.projects) throw new Error('Not a valid backup file');
        if (!confirm(`This backup has ${backup.projects.length} project(s). Restoring will REPLACE all current data. Continue?`)) return;
        btProjects = backup.projects;
        btTrash = backup.trash || [];
        bt_save(); bt_saveTrash();
        alert('Backup restored.');
        btState.view = 'projects';
        bt_render();
      } catch (err) {
        alert('Could not read this file as a valid backup: ' + err.message);
      }
    };
    reader.readAsText(file);
  }

  function bt_exportAllTradesCSV() {
    let rows = [['project','version','type','num','date','direction','resultR','dataType_or_rulesFollowed']];
    btProjects.forEach(proj => {
      proj.versions.forEach(ver => {
        ver.trades.forEach(t => rows.push([proj.name, ver.label, 'backtest', t.num, t.date, t.direction, t.resultR, t.dataType]));
        (ver.liveTrades||[]).forEach(t => rows.push([proj.name, ver.label, 'live', t.num, t.date, t.direction, t.resultR, t.rulesFollowed]));
      });
    });
    const csv = rows.map(r => r.map(v => `"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'all-trades-' + new Date().toISOString().slice(0,10) + '.csv';
    a.click(); URL.revokeObjectURL(url);
  }



  function bt_save() {
    try { localStorage.setItem('btProjects', JSON.stringify(btProjects)); return true; }
    catch (e) { console.error('Storage full', e); return false; }
  }
  function bt_uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function bt_logHistory(ver, entity, entityLabel, field, oldValue, newValue) {
    if (!ver.history) ver.history = [];
    if ((oldValue||'') === (newValue||'')) return;
    ver.history.push({ id: bt_uid(), ts: new Date().toISOString(), entity, entityLabel, field, oldValue, newValue });
    if (ver.history.length > 300) ver.history = ver.history.slice(-300);
  }

  function bt_findProject(id) { return btProjects.find(p => p.id === id); }
  function bt_findVersion(proj, vid) { return proj.versions.find(v => v.id === vid); }

  function bt_esc(s) { return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  // --- Fullscreen field editor (tap a field to read/write it full-screen) ---
  btState.fsTarget = null;
  btState.accordionOpen = {};

  function bt_toggleAccordion(id) {
    btState.accordionOpen[id] = !btState.accordionOpen[id];
    bt_render();
  }

  function bt_accordion(id, title, innerHtml, defaultOpen) {
    const isOpen = btState.accordionOpen.hasOwnProperty(id) ? btState.accordionOpen[id] : !!defaultOpen;
    let html = `<button type="button" class="bt-accordion-header" onclick="bt_toggleAccordion('${id}')">
      <span>${title}</span><span class="chev">${isOpen ? '▾' : '▸'}</span>
    </button>`;
    if (isOpen) html += `<div class="bt-accordion-body">${innerHtml}</div>`;
    return html;
  }

  function bt_fieldPreviewHtml(kind, entityId, field, label, value, readonly) {
    const text = (value || '').trim();
    const preview = text ? bt_esc(text.length > 80 ? text.slice(0,80) + '…' : text) : 'Tap to write…';
    const idAttr = entityId ? `'${entityId}'` : 'null';
    return `<label class="bt-field-label">${label}</label>
      <button type="button" class="bt-field-preview ${text?'':'empty'}" onclick="bt_openFieldEditor('${kind}',${idAttr},'${field}','${bt_esc(label)}')">${preview}<span class="tap-hint">${readonly?'view':'tap to edit'} ›</span></button>`;
  }

  function bt_getFieldValue(kind, entityId, field) {
    const proj = bt_findProject(btState.projectId);
    if (kind === 'rulebook') { const ver = bt_findVersion(proj, btState.versionId); return ver.rulebook[field]; }
    if (kind === 'project') { return proj[field]; }
    if (kind === 'trade') { const ver = bt_findVersion(proj, btState.versionId); const t = ver.trades.find(x=>x.id===entityId); return t[field]; }
    if (kind === 'liveTrade') { const ver = bt_findVersion(proj, btState.versionId); const t = ver.liveTrades.find(x=>x.id===entityId); return t[field]; }
    if (kind === 'dbentry') { const e = dbEntries.find(x=>x.id===entityId); return e ? e[field] : ''; }
    if (kind === 'dbhyp') { const h = dbHypotheses.find(x=>x.id===entityId); return h ? h[field] : ''; }
    return '';
  }

  function bt_isFieldReadonly(kind) {
    if (kind === 'rulebook') {
      const proj = bt_findProject(btState.projectId);
      const ver = bt_findVersion(proj, btState.versionId);
      return !!ver.frozen;
    }
    return false;
  }

  function bt_openFieldEditor(kind, entityId, field, label) {
    const value = bt_getFieldValue(kind, entityId, field) || '';
    const readonly = bt_isFieldReadonly(kind);
    btState.fsTarget = { kind, entityId, field, readonly };
    document.getElementById('btFsLabel').textContent = label + (readonly ? ' (frozen — read only)' : '');
    const ta = document.getElementById('btFsTextarea');
    const ro = document.getElementById('btFsReadonly');
    if (readonly) {
      ta.style.display = 'none';
      ro.style.display = 'block';
      ro.textContent = value || '(empty)';
    } else {
      ta.style.display = 'block';
      ro.style.display = 'none';
      ta.value = value;
    }
    document.getElementById('btFsOverlay').style.display = 'flex';
    if (!readonly) setTimeout(() => ta.focus(), 50);
  }

  function bt_closeFieldEditor() {
    const target = btState.fsTarget;
    if (target && !target.readonly) {
      const value = document.getElementById('btFsTextarea').value;
      if (target.kind === 'rulebook') bt_updateRulebookField(target.field, value);
      if (target.kind === 'project') bt_updateProjectField(target.field, value);
      if (target.kind === 'trade') bt_updateTradeField(target.entityId, target.field, value);
      if (target.kind === 'liveTrade') bt_updateLiveTradeField(target.entityId, target.field, value);
      if (target.kind === 'dbentry') db_updateEntryField(target.entityId, target.field, value);

    proj.versions.forEach(v => {

        warnings.push(`${v.label} has only ${inSample.length} in-sample trades so far. Results may not be reliable yet — treat early conclusions with caution.`);

  function bt_canonicalizeTag(ver, field, rawValue) {
    let v = (rawValue || '').replace(/\s+/g, ' ').trim();
    if (!v) return v;
    const existing = ver.trades.map(t => t[field]).filter(x => x && x.trim());
    const match = existing.find(e => e.replace(/\s+/g, ' ').trim().toLowerCase() === v.toLowerCase());
    return match || v;
  }

  function bt_sortByDate(arr) {

      return (a.num || 0) - (b.num || 0);

  // --- Multi-tag setup types (with legacy single-field fallback) ---
  function bt_tradeTags(t) {
    if (t.setupTags && t.setupTags.length) return t.setupTags;

    return [];

  function bt_addTradeTag(tid, rawValue) {
    const proj = bt_findProject(btState.projectId);
    const ver = bt_findVersion(proj, btState.versionId);
    const t = ver.trades.find(x => x.id === tid);
    if (!t.setupTags) t.setupTags = bt_tradeTags(t);
    const canon = bt_canonicalizeSetupTag(ver, rawValue);
    if (canon && !t.setupTags.includes(canon)) {
      bt_logHistory(ver, 'trade', '#'+t.num, 'setupTags', t.setupTags.join(', '), [...t.setupTags, canon].join(', '));
      t.setupTags.push(canon);

  function bt_removeTradeTag(tid, tag) {
    const proj = bt_findProject(btState.projectId);
    const ver = bt_findVersion(proj, btState.versionId);
    const t = ver.trades.find(x => x.id === tid);
    if (!t.setupTags) t.setupTags = bt_tradeTags(t);
    bt_logHistory(ver, 'trade', '#'+t.num, 'setupTags', t.setupTags.join(', '), t.setupTags.filter(x=>x!==tag).join(', '));
    t.setupTags = t.setupTags.filter(x => x !== tag);
    bt_save();

  function bt_canonicalizeSetupTag(ver, rawValue) {
    let v = (rawValue || '').replace(/\s+/g, ' ').trim();
    if (!v) return v;
    const existing = [];
    ver.trades.forEach(t => bt_tradeTags(t).forEach(tag => existing.push(tag)));
    const match = existing.find(e => e.replace(/\s+/g,' ').trim().toLowerCase() === v.toLowerCase());
    return match || v;
  }

    const file = inputEl.files[0];
    if (!file) return;
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => {
      img.onload = () => {
        const maxW = 480;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        bt_setTradeScreenshot(tid, stage, canvas.toDataURL('image/jpeg', 0.6));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);

  // --- Strategy Health verdicts (per data category + overall) ---
  function bt_categoryHealthVerdict(trades, catLabel) {
    const m = bt_computeMetrics(trades);
    if (m.total === 0) return { label: `No ${catLabel} trades logged yet`, tone: 'neutral' };
    if (m.total < 15) return { label: `Too early — only ${m.total} trade${m.total!==1?'s':''}`, tone: 'neutral' };
    if (m.expectancy > 0) return { label: `Positive edge — ${bt_fmtR(m.expectancy)}/trade over ${m.total} trades`, tone: 'good' };
    if (m.expectancy < 0) return { label: `No edge shown — ${bt_fmtR(m.expectancy)}/trade over ${m.total} trades`, tone: 'warn' };
    return { label: `Break-even over ${m.total} trades`, tone: 'neutral' };
  }

  function bt_overallHealthVerdict(ver) {
    const inS = ver.trades.filter(t => t.dataType === 'in-sample');
    const oos = ver.trades.filter(t => t.dataType === 'out-of-sample');
    const fwd = ver.trades.filter(t => t.dataType === 'forward-test');
    const mIn = bt_computeMetrics(inS), mOos = bt_computeMetrics(oos), mFwd = bt_computeMetrics(fwd);
    if (mIn.total < 20) return { label: `Too early to judge — only ${mIn.total} in-sample trades logged`, tone: 'neutral' };
    if (mOos.total === 0 && mFwd.total === 0) return { label: 'Backtested only — not yet validated on out-of-sample or forward data', tone: 'neutral' };
    const validated = (mOos.total >= 15 && mOos.expectancy > 0) || (mFwd.total >= 15 && mFwd.expectancy > 0);
    const droppedOff = (mOos.total > 0 && mOos.expectancy < 0) || (mFwd.total > 0 && mFwd.expectancy < 0);
    if (mIn.expectancy > 0 && droppedOff) return { label: 'Warning — performance drops outside in-sample data, possible overfitting', tone: 'warn' };
    if (mIn.expectancy > 0 && validated) return { label: 'Promising — expectancy holds up outside in-sample data', tone: 'good' };
    if ((mOos.total > 0 && mOos.total < 15) || (mFwd.total > 0 && mFwd.total < 15)) return { label: 'Early validation stage — out-of-sample/forward sample still small', tone: 'neutral' };
    if (mIn.expectancy <= 0) return { label: 'No edge shown yet, even in-sample', tone: 'warn' };
    return { label: 'Mixed results — review before increasing size', tone: 'neutral' };
  }

  // --- R-Multiple distribution histogram ---
  function bt_histogramBuckets(trades) {
    const buckets = [
      { label: '≤-2R', test: r => r <= -2 },
      { label: '-2..-1R', test: r => r > -2 && r <= -1 },
      { label: '-1..0R', test: r => r > -1 && r < 0 },
      { label: '0R', test: r => r === 0 },
      { label: '0..1R', test: r => r > 0 && r <= 1 },
      { label: '1..2R', test: r => r > 1 && r <= 2 },
      { label: '2..5R', test: r => r > 2 && r <= 5 },
      { label: '5R+', test: r => r > 5 },
    ];
    return buckets.map(b => ({ label: b.label, count: trades.filter(t => b.test(t.resultR)).length }));
  }

  function bt_histogramSvg(trades) {
    const buckets = bt_histogramBuckets(trades);
    const max = Math.max(1, ...buckets.map(b => b.count));
    const w = 400, h = 130, barW = w / buckets.length;
    let bars = buckets.map((b,i) => {
      const barH = (b.count / max) * (h - 30);
      const x = i * barW + 4;
      const y = h - 20 - barH;
      return `<rect x="${x}" y="${y}" width="${barW-8}" height="${barH}" fill="#38bdf8" opacity="0.85" rx="2"/>
        <text x="${x+(barW-8)/2}" y="${h-20-barH-4}" font-size="10" fill="#eafff5" text-anchor="middle">${b.count}</text>
        <text x="${x+(barW-8)/2}" y="${h-6}" font-size="8" fill="#9fd7c4" text-anchor="middle">${b.label}</text>`;
    }).join('');
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:130px;background:rgba(255,255,255,0.04);border-radius:8px;">${bars}</svg>`;
  }

  // --- Monte Carlo simulation ---
  function bt_runMonteCarlo(trades, numSims, numTrades) {
    const rValues = trades.map(t => t.resultR);
    if (rValues.length < 20) return null;
    const finals = [], maxDDs = [], longestLossStreaks = [];
    for (let s = 0; s < numSims; s++) {
      let cum = 0, peak = 0, dd = 0, lossStreak = 0, longestLoss = 0;
      for (let i = 0; i < numTrades; i++) {
        const r = rValues[Math.floor(Math.random() * rValues.length)];
        cum += r;
        if (cum > peak) peak = cum;
        if (cum - peak < dd) dd = cum - peak;
        if (r < 0) { lossStreak++; if (lossStreak > longestLoss) longestLoss = lossStreak; } else { lossStreak = 0; }
      }
      finals.push(cum); maxDDs.push(dd); longestLossStreaks.push(longestLoss);
    }
    finals.sort((a,b)=>a-b); maxDDs.sort((a,b)=>a-b); longestLossStreaks.sort((a,b)=>a-b);
    const pct = (arr, p) => arr[Math.floor(p * (arr.length-1))];
    const probNegative = finals.filter(f => f < 0).length / finals.length * 100;
    return {
      p5: pct(finals,0.05), p50: pct(finals,0.5), p95: pct(finals,0.95),
      ddP50: pct(maxDDs,0.5), ddP95: pct(maxDDs,0.05), // maxDDs sorted ascending (more negative = worse), p05 index = worst 5%
      lossStreakP95: pct(longestLossStreaks,0.95),
      probNegative
    };
  }

  function bt_monteCarloCard(trades) {
    const numTrades = btState.mcNumTrades || 10;
    const sim = bt_runMonteCarlo(trades, 500, numTrades);
    let html = '';
    html += `<div class="bt-warn">⚠ This is a hypothetical statistical simulation — NOT real life, not a prediction, and not a guarantee. It randomly resamples your own past R results to show a plausible range of outcomes. Real trading involves news, slippage, execution mistakes, and emotions this simulation cannot capture.</div>`;
    html += `<label class="bt-field-label">Simulate how many trades ahead?</label>
      <div style="display:flex;gap:8px;">
        <input class="bt-input" style="margin-bottom:8px;" type="number" min="1" max="1000" value="${numTrades}" onchange="bt_setMcNumTrades(this.value)">
      </div>`;
    if (!sim) {
      html += `<div class="bt-note">Need at least 20 logged trades in this category to run a simulation.</div>`;
      return html;
    }
    html += `<div class="bt-hero"><div class="hv ${sim.p50>0?'tone-good':sim.p50<0?'tone-warn':''}">${bt_fmtR(sim.p50)}</div><div class="hl">Median Result After ${numTrades} Trades</div></div>`;
    html += `<div class="bt-metric-grid">
      <div class="bt-metric-box tone-warn"><div class="v">${bt_fmtR(sim.p5)}</div><div class="l">Worst 5% (${numTrades} trades)</div></div>
      <div class="bt-metric-box tone-good"><div class="v">${bt_fmtR(sim.p95)}</div><div class="l">Best 5% (${numTrades} trades)</div></div>
      <div class="bt-metric-box ${sim.probNegative>=50?'tone-warn':sim.probNegative>=25?'tone-caution':'tone-good'}"><div class="v">${sim.probNegative.toFixed(0)}%</div><div class="l">Chance of net loss</div></div>
      <div class="bt-metric-box"><div class="v">${bt_fmtR(sim.ddP50)}</div><div class="l">Typical max drawdown</div></div>
      <div class="bt-metric-box tone-warn"><div class="v">${bt_fmtR(sim.ddP95)}</div><div class="l">Worst-case drawdown (5%)</div></div>
      <div class="bt-metric-box"><div class="v">${sim.lossStreakP95}</div><div class="l">Worst losing streak (5%)</div></div>
    </div>
    <div class="bt-note">Based on 500 randomized simulations of ${numTrades} trades each, resampled from your ${trades.length} logged results in this category.</div>`;
    return html;
  }

  function bt_updateTradeField(tid, field, value) {

    if (field === 'session' || field === 'setupType') value = bt_canonicalizeTag(ver, field, value);

  function bt_setDataTab(tab) { btState.dataTab = tab; bt_render(); }

  function bt_computeMetrics(trades) {
    const total = trades.length;
    if (total === 0) return { total: 0 };
    const wins = trades.filter(t => t.resultR > 0);
    const losses = trades.filter(t => t.resultR < 0);
    const be = trades.filter(t => t.resultR === 0);
    const totalR = trades.reduce((s,t) => s + t.resultR, 0);
    const avgWin = wins.length ? wins.reduce((s,t)=>s+t.resultR,0)/wins.length : null;
    const avgLoss = losses.length ? losses.reduce((s,t)=>s+t.resultR,0)/losses.length : null;
    const winRate = (wins.length + losses.length) ? wins.length/(wins.length+losses.length)*100 : null;
    const expectancy = totalR / total;

    let cum = 0, peak = 0, maxDD = 0, equity = [];
    trades.forEach(t => {
      cum += t.resultR;
      if (cum > peak) peak = cum;
      const dd = cum - peak;
      if (dd < maxDD) maxDD = dd;
      equity.push(cum);
    });
    const currentDD = equity.length ? equity[equity.length-1] - peak : 0;

    let longestWin=0, longestLoss=0, curWinRun=0, curLossRun=0;
    let sequence = [];
    trades.forEach(t => {
      if (t.resultR > 0) { curWinRun++; curLossRun=0; sequence.push('W'); }
      else if (t.resultR < 0) { curLossRun++; curWinRun=0; sequence.push('L'); }
      else { curWinRun=0; curLossRun=0; sequence.push('B'); }
      if (curWinRun > longestWin) longestWin = curWinRun;
      if (curLossRun > longestLoss) longestLoss = curLossRun;
    });
    let currentStreak = 0, currentStreakType = '';
    for (let i = sequence.length-1; i >= 0; i--) {
      if (i === sequence.length-1) { currentStreakType = sequence[i]; currentStreak = 1; }
      else if (sequence[i] === currentStreakType) currentStreak++;
      else break;
    }

    return { total, wins: wins.length, losses: losses.length, be: be.length, winRate, avgWin, avgLoss, totalR, expectancy, maxDD, currentDD, longestWin, longestLoss, currentStreak, currentStreakType, sequence, equity };
  }

  function bt_fmtR(v) { if (v===null||v===undefined||isNaN(v)) return '—'; return (v>0?'+':'') + v.toFixed(2) + 'R'; }
  function bt_fmtPct(v) { return v===null ? '—' : v.toFixed(1)+'%'; }

  // --- Winner/Loser condition comparison ---
  btState.condField = 'marketEnv';
  btState.condValue = '';
  btState.condChips = [];

  function bt_setCondField(field) { btState.condField = field; btState.condValue = ''; bt_render(); }
  function bt_setCondValue(value) { btState.condValue = value; bt_render(); }
  function bt_addCondChip() {
    if (!btState.condValue) return;
    const exists = btState.condChips.some(c => c.field === btState.condField && c.value === btState.condValue);
    if (!exists) btState.condChips.push({ field: btState.condField, value: btState.condValue });
    btState.condValue = '';
    bt_render();
  }
  function bt_removeCondChip(idx) { btState.condChips.splice(idx, 1); bt_render(); }
  function bt_clearCondChips() { btState.condChips = []; bt_render(); }

  function bt_distinctValues(trades, field) {
    const set = new Set();
    if (field === 'setupTags') {
      trades.forEach(t => bt_tradeTags(t).forEach(tag => set.add(tag)));
    } else {
      trades.forEach(t => { if (t[field] && t[field].trim()) set.add(t[field].trim()); });
    }
    return Array.from(set);
  }

  function bt_hasCondValue(t, field, value) {
    if (field === 'setupTags') return bt_tradeTags(t).includes(value);
    return (t[field]||'').trim() === value;
  }

  function bt_conditionCompare(trades, field, value) {
    const present = trades.filter(t => bt_hasCondValue(t, field, value));
    const absent = trades.filter(t => !bt_hasCondValue(t, field, value));
    const winsWithValue = trades.filter(t => t.resultR > 0 && bt_hasCondValue(t, field, value)).length;
    const lossesWithValue = trades.filter(t => t.resultR < 0 && bt_hasCondValue(t, field, value)).length;
    const totalWins = trades.filter(t => t.resultR > 0).length;
    const totalLosses = trades.filter(t => t.resultR < 0).length;
    return {
      present: bt_computeMetrics(present),
      absent: bt_computeMetrics(absent),
      pctOfWinners: totalWins ? (winsWithValue/totalWins*100) : null,
      pctOfLosers: totalLosses ? (lossesWithValue/totalLosses*100) : null
    };
  }

  // --- Shared multi-condition (stacked AND) comparison engine ---
  // chips: [{field, value}, ...] — a trade matches only if it satisfies every chip
  function bt_matchesAllChips(t, chips) {
    return chips.every(c => bt_hasCondValue(t, c.field, c.value));
  }

  function bt_multiConditionCompare(trades, chips) {
    if (chips.length === 0) return { matched: bt_computeMetrics([]), rest: bt_computeMetrics(trades), pctOfWinners: null, pctOfLosers: null };
    const matched = trades.filter(t => bt_matchesAllChips(t, chips));
    const rest = trades.filter(t => !bt_matchesAllChips(t, chips));
    const totalWins = trades.filter(t => t.resultR > 0).length;
    const totalLosses = trades.filter(t => t.resultR < 0).length;
    const matchedWins = matched.filter(t => t.resultR > 0).length;
    const matchedLosses = matched.filter(t => t.resultR < 0).length;
    return {
      matched: bt_computeMetrics(matched), rest: bt_computeMetrics(rest),
      pctOfWinners: totalWins ? (matchedWins/totalWins*100) : null,
      pctOfLosers: totalLosses ? (matchedLosses/totalLosses*100) : null
    };
  }

  function bt_sampleSizeWarning(n, chipCount) {
    if (chipCount >= 2 && n > 0 && n < 5) return { text: `Only ${n} trade${n!==1?'s':''} match all ${chipCount} conditions combined — this is far too small a sample to mean anything. What looks like a pattern here is most likely coincidence.`, tone: 'warn' };
    if (n > 0 && n < 15) return { text: `${n} matching trades — still an early sample. Treat this as a lead to keep watching, not a conclusion.`, tone: 'caution' };
    if (n === 0) return { text: 'No trades match this combination yet.', tone: 'neutral' };
    return { text: `${n} matching trades — a reasonable sample to start drawing tentative conclusions from.`, tone: 'good' };
  }

  const BT_CONDITION_FIELDS = [['marketEnv','Market Environment'],['volatility','Volatility'],['session','Session'],['setupTags','Setup Type']];

  function bt_equitySvg(equity) {
    if (equity.length === 0) return '<div class="bt-note">No trades yet — nothing to plot.</div>';
    const w = 400, h = 140, pad = 10;
    const min = Math.min(0, ...equity), max = Math.max(0, ...equity);
    const range = (max - min) || 1;
    const stepX = equity.length > 1 ? (w - pad*2) / (equity.length - 1) : 0;
    const pts = equity.map((v,i) => {
      const x = pad + i*stepX;
      const y = h - pad - ((v - min) / range) * (h - pad*2);
      return x.toFixed(1) + ',' + y.toFixed(1);
    }).join(' ');
    const zeroY = h - pad - ((0 - min) / range) * (h - pad*2);
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:140px;background:#f8f8f8;border-radius:8px;">
      <line x1="${pad}" y1="${zeroY.toFixed(1)}" x2="${w-pad}" y2="${zeroY.toFixed(1)}" stroke="#ccc" stroke-dasharray="4,4"/>
      <polyline points="${pts}" fill="none" stroke="#2b6cb0" stroke-width="2"/>
    </svg>`;
  }

  function bt_ruleCheckSummary(checks) {
    const vals = Object.values(checks || {});
    const met = vals.filter(c => c.status === 'met').length;
    const notMet = vals.filter(c => c.status === 'not-met').length;
    const unclear = vals.filter(c => c.status === 'unclear').length;
    const na = vals.filter(c => c.status === 'na').length;
    const denom = met + notMet;
    return { met, notMet, unclear, na, pct: denom ? (met/denom*100) : null };
  }

  function bt_logLiveTrade(r) {
    const proj = bt_findProject(btState.projectId);
    const ver = bt_findVersion(proj, btState.versionId);
    if (!ver.liveTrades) ver.liveTrades = [];
    const dateVal = document.getElementById('btLiveTradeDate') ? document.getElementById('btLiveTradeDate').value : new Date().toISOString().slice(0,10);
    const num = ver.liveTrades.length + 1;
    const ruleChecks = JSON.parse(JSON.stringify(btState.tempRuleChecks));
    const summary = bt_ruleCheckSummary(ruleChecks);
    ver.liveTrades.push({
      id: bt_uid(), num, date: dateVal || new Date().toISOString().slice(0,10),
      direction: btState.liveTempDir, resultR: r,
      rulesFollowed: summary.pct !== null ? (summary.pct >= 100 ? 'yes' : (summary.notMet>0?'no':btState.liveTempFollowed)) : btState.liveTempFollowed,
      riskRulesFollowed: '', exitedPerPlan: '',
      contextBefore: '', changesMade: '', emotionalState: '', mistakes: '', marketEvents: '',
      wentWell: '', wentBadly: '', learned: '', expanded: false,

    bt_render();

  function bt_removeLiveScreenshot(tid, stage) {
    bt_setLiveScreenshot(tid, stage, '');
  }

  function bt_handleScreenshotUpload(tid, stage, inputEl) {
    const file = inputEl.files[0];
    if (!file) return;
    const img = new Image();
    const reader = new FileReader();
    reader.onload = (e) => {
      img.onload = () => {
        const maxW = 480;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
        bt_setLiveScreenshot(tid, stage, dataUrl);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function bt_estimateStorageKB() {
    let total = 0;
    for (let k in localStorage) {
      if (localStorage.hasOwnProperty(k)) total += (localStorage[k].length + k.length);
    }
    return Math.round(total / 1024);
  }

  function bt_flattenTrades() {
    let recs = [];
    btProjects.forEach(proj => {
      proj.versions.forEach(ver => {
        const verKey = proj.name + ' / ' + ver.label;
        ver.trades.forEach(t => {
          recs.push({
            source: 'backtest', projId: proj.id, verId: ver.id, verKey,
            asset: proj.asset || '(no asset set)', direction: t.direction, resultR: t.resultR,
            dataType: t.dataType, rulesFollowed: '', date: t.date || '', month: (t.date||'').slice(0,7),
            session: t.session || '(none)', volatility: t.volatility || '(none)', marketEnv: t.marketEnv || '', diffReason: ''
          });
        });
        (ver.liveTrades||[]).forEach(t => {
          recs.push({
            source: 'live', projId: proj.id, verId: ver.id, verKey,
            asset: proj.asset || '(no asset set)', direction: t.direction, resultR: t.resultR,
            dataType: '', rulesFollowed: t.rulesFollowed || '', date: t.date || '', month: (t.date||'').slice(0,7),
            session: '(none)', volatility: '(none)', marketEnv: '', diffReason: t.diffReason || ''
          });
        });
      });
    });
    return recs;
  }

  function bt_applyAnaFilters(recs) {
    const f = btState.anaFilters || {};
    return recs.filter(r => {
      if (f.asset && r.asset !== f.asset) return false;
      if (f.verKey && r.verKey !== f.verKey) return false;
      if (f.direction && r.direction !== f.direction) return false;
      if (f.source && r.source !== f.source) return false;
      if (f.dateStart && r.date && r.date < f.dateStart) return false;
      if (f.dateEnd && r.date && r.date > f.dateEnd) return false;
      return true;
    });
  }

  function bt_setAnaFilter(key, value) {
    if (!btState.anaFilters) btState.anaFilters = {};
    btState.anaFilters[key] = (btState.anaFilters[key] === value) ? '' : value;
    bt_render();
  }

  function bt_groupBy(recs, key) {
    const map = {};
    recs.forEach(r => {
      const k = r[key] || '(none)';

      map[k].push(r);
    });

  function bt_complianceScore(trades, sinceDays) {
    const cutoff = sinceDays === null ? null : new Date(Date.now() - sinceDays*86400000);
    const relevant = trades.filter(t => {
      if (t.rulesFollowed !== 'yes' && t.rulesFollowed !== 'no') return false;
      if (cutoff === null) return true;
      return new Date(t.date) >= cutoff;
    });
    if (relevant.length === 0) return null;
    const followed = relevant.filter(t => t.rulesFollowed === 'yes').length;
    return (followed / relevant.length) * 100;
  }

    html += `<div style="display:flex;gap:8px;">
      <div style="flex:1;"><label class="bt-field-label">From date</label><input class="bt-input" type="date" onchange="btState.anaFilters.dateStart=this.value; bt_render();" value="${f.dateStart||''}"></div>
      <div style="flex:1;"><label class="bt-field-label">To date</label><input class="bt-input" type="date" onchange="btState.anaFilters.dateEnd=this.value; bt_render();" value="${f.dateEnd||''}"></div>
    </div>`;
    if (Object.values(f).some(v=>v)) {
      html += `<button class="bt-tab" onclick="btState.anaFilters={}; bt_render();">Clear Filters</button>`;
    }
    html += '</div>';

    const filtered = bt_applyAnaFilters(allRecs);

    // --- Tabs ---
    const tabs = [['backtesting','Backtesting'],['live','Live'],['discipline','Discipline'],['comparison','Comparison']];
    html += `<div class="bt-tab-row">`;
    tabs.forEach(([key,label]) => { html += `<button class="bt-tab ${btState.anaTab===key?'on':''}" onclick="btState.anaTab='${key}'; bt_render();">${label}</button>`; });
    html += '</div>';

    if (btState.anaTab === 'backtesting') {
      const recs = bt_sortByDate(filtered.filter(r => r.source === 'backtest'));
      const m = bt_computeMetrics(recs);
      html += bt_anaMetricsCard('Backtesting', recs, m);
    }

    if (btState.anaTab === 'live') {
      const recs = bt_sortByDate(filtered.filter(r => r.source === 'live'));
      const m = bt_computeMetrics(recs);
      html += bt_anaMetricsCard('Live', recs, m);
    }

    if (btState.anaTab === 'discipline') {
      const recs = filtered.filter(r => r.source === 'live');
      const tagged = recs.filter(r => r.rulesFollowed === 'yes' || r.rulesFollowed === 'no');
      const followed = tagged.filter(r => r.rulesFollowed === 'yes').length;
      const broken = tagged.filter(r => r.rulesFollowed === 'no').length;
      const withDiff = recs.filter(r => r.diffReason).length;
      html += `<div class="bt-card"><h3>Discipline</h3>`;
      if (recs.length === 0) {
        html += '<div class="bt-note">No live trades in the current filter to analyze.</div>';
      } else {
        const compPct = tagged.length ? (followed/tagged.length*100) : null;
        const compTone = compPct===null ? '' : compPct>=80?'tone-good':compPct>=50?'tone-caution':'tone-warn';
        html += `<div class="bt-hero"><div class="hv ${compTone}">${compPct===null?'—':compPct.toFixed(0)+'%'}</div><div class="hl">Compliance</div></div>`;
        html += `<div class="bt-metric-grid">
          <div class="bt-metric-box tone-warn"><div class="v">${broken}</div><div class="l">Rule Violations</div></div>
          <div class="bt-metric-box"><div class="v">${withDiff}</div><div class="l">Planned≠Actual Trades</div></div>
          <div class="bt-metric-box"><div class="v">${recs.length}</div><div class="l">Sample (Live Trades)</div></div>
        </div>
        <div class="bt-note">Sample: ${recs.length} live trades, ${tagged.length} with a rule-followed tag recorded.</div>`;
      }
      html += '</div>';
    }

    if (btState.anaTab === 'comparison') {
      const groupOptions = [['asset','Asset'],['verKey','Version'],['direction','Long / Short'],['month','Month'],['session','Session'],['volatility','Volatility']];
      html += `<div class="bt-card"><h3>Comparison</h3>`;
      html += `<label class="bt-field-label">Group by</label><div class="bt-pill-row">`;
      groupOptions.forEach(([key,label]) => { html += `<button class="bt-pill ${btState.anaGroupBy===key?'on':''}" onclick="btState.anaGroupBy='${key}'; bt_render();">${label}</button>`; });
      html += '</div>';
      const groups = bt_groupBy(filtered, btState.anaGroupBy);
      const keys = Object.keys(groups).sort();
      if (keys.length === 0) {
        html += '<div class="bt-note">No trades match the current filters.</div>';
      } else {
        html += `<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-size:13px;">
          <tr><th style="text-align:left;padding:4px;">${groupOptions.find(g=>g[0]===btState.anaGroupBy)[1]}</th><th style="text-align:left;padding:4px;">Trades</th><th style="text-align:left;padding:4px;">Win Rate</th><th style="text-align:left;padding:4px;">Expectancy</th><th style="text-align:left;padding:4px;">Total R</th></tr>
          ${keys.map(k => { const m = bt_computeMetrics(bt_sortByDate(groups[k])); return `<tr><td style="padding:4px;">${bt_esc(k)}</td><td style="padding:4px;">${m.total}</td><td style="padding:4px;">${bt_fmtPct(m.winRate)}</td><td style="padding:4px;">${bt_fmtR(m.expectancy)}</td><td style="padding:4px;">${bt_fmtR(m.totalR)}</td></tr>`; }).join('')}
        </table></div>`;
        html += `<div class="bt-note" style="margin-top:10px;">Small groups (under ~15 trades) can look dramatically better or worse purely by chance — check the trade count before drawing conclusions from any one row.</div>`;
      }
      html += '</div>';
    }

    return html;
  }

  function bt_anaMetricsCard(title, recs, m) {
    if (recs.length === 0) {
      return `<div class="bt-card"><h3>${title}</h3><div class="bt-note">No trades match the current filters.</div></div>`;
    }
    const expTone = m.expectancy > 0 ? 'tone-good' : m.expectancy < 0 ? 'tone-warn' : '';
    return `<div class="bt-card"><h3>${title}</h3>
      <div class="bt-hero"><div class="hv ${expTone}">${bt_fmtR(m.expectancy)}</div><div class="hl">Expectancy / Trade</div></div>
      <div class="bt-metric-grid">
        <div class="bt-metric-box"><div class="v">${m.total}</div><div class="l">Total Trades</div></div>
        <div class="bt-metric-box"><div class="v">${bt_fmtPct(m.winRate)}</div><div class="l">Win Rate</div></div>
        <div class="bt-metric-box"><div class="v">${bt_fmtR(m.totalR)}</div><div class="l">Total R</div></div>
        <div class="bt-metric-box tone-warn"><div class="v">${bt_fmtR(m.maxDD)}</div><div class="l">Max Drawdown</div></div>
        <div class="bt-metric-box tone-warn"><div class="v">${m.longestLoss}</div><div class="l">Longest Loss Streak</div></div>
      </div>
      ${bt_equitySvg(m.equity)}
    </div>`;
  }
