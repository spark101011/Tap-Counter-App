  function db_renderResearchListView() {
    let html = `<button class="bt-tab" onclick="dbState.view='home'; db_render();">← Back</button>`;
    html += `<div class="bt-card"><h3>Research</h3>
      <div class="bt-note">Observations you've turned into formal, testable hypotheses — tracked honestly from first hunch to supported, rejected, or still needing data.</div>
      <div class="bt-note" style="font-style:italic;">This section preserves what was observed, what was believed, what was tested, what actually happened, and what changed — never rewriting history to make a research idea look better than it was.</div>
      <button class="bt-btn-primary" style="width:100%;padding:10px;border:none;border-radius:8px;" onclick="db_newHypothesis()">+ New Hypothesis (blank)</button>
      <div class="bt-note">Or open any entry's "🔬 Convert to Hypothesis" button to start from something you already logged.</div>
    </div>`;
    if (dbHypotheses.length === 0) {
      html += '<div class="bt-note">No hypotheses yet.</div>';
      return html;
    }
    const failedCount = dbHypotheses.filter(h=>h.status==='Rejected').length;
    const needDataCount = dbHypotheses.filter(h=>h.status==='Needs More Data').length;
    html += `<div class="bt-row-btns" style="max-width:460px;margin:0 auto 10px;">
      <button onclick="dbState.researchFilter='Rejected'; db_render();">📂 Failure Library (${failedCount})</button>
      <button onclick="dbState.researchFilter='Needs More Data'; db_render();">📂 Needs More Data (${needDataCount})</button>
    </div>`;
    const filterOptions = ['all', ...DB_HYP_STATUSES];
    html += `<div class="bt-pill-row" style="max-width:460px;margin:0 auto 10px;">`;
    filterOptions.forEach(f => { html += `<button class="bt-pill ${dbState.researchFilter===f?'on':''}" onclick="dbState.researchFilter='${f}'; db_render();">${f==='all'?'All':f}</button>`; });
    html += '</div>';

    if (dbHypotheses.length >= 2) {
      html += `<div class="bt-card"><h3>Compare Two Hypotheses</h3>
        <select class="bt-select" onchange="dbState.compareHypA=this.value; db_render();">
          <option value="">Hypothesis A</option>
          ${dbHypotheses.map(h=>`<option value="${h.id}" ${dbState.compareHypA===h.id?'selected':''}>${bt_esc(h.name)}</option>`).join('')}
        </select>
        <select class="bt-select" onchange="dbState.compareHypB=this.value; db_render();">
          <option value="">Hypothesis B</option>
          ${dbHypotheses.map(h=>`<option value="${h.id}" ${dbState.compareHypB===h.id?'selected':''}>${bt_esc(h.name)}</option>`).join('')}
        </select>`;
      if (dbState.compareHypA && dbState.compareHypB) {
        const hA = db_findHypothesis(dbState.compareHypA), hB = db_findHypothesis(dbState.compareHypB);
        const mA = bt_computeMetrics(bt_sortByDate(hA.testResults)), mB = bt_computeMetrics(bt_sortByDate(hB.testResults));
        html += `<div class="bt-note">Evidence shown side by side — not declaring either one "better."</div>
        <div class="bt-compare-cols">
          <div class="bt-compare-col"><h4>${bt_esc(hA.name).toUpperCase()}</h4>
            <div class="m"><span>Status</span><span>${bt_esc(hA.status)}</span></div>
            <div class="m"><span>Tests</span><span>${mA.total}</span></div>
            <div class="m"><span>Win Rate</span><span>${mA.total?bt_fmtPct(mA.winRate):'—'}</span></div>
            <div class="m"><span>Expectancy</span><span>${mA.total?bt_fmtR(mA.expectancy):'—'}</span></div>
            <div class="m"><span>Max DD</span><span>${mA.total?bt_fmtR(mA.maxDD):'—'}</span></div>
          </div>
          <div class="bt-compare-col"><h4>${bt_esc(hB.name).toUpperCase()}</h4>
            <div class="m"><span>Status</span><span>${bt_esc(hB.status)}</span></div>
            <div class="m"><span>Tests</span><span>${mB.total}</span></div>
            <div class="m"><span>Win Rate</span><span>${mB.total?bt_fmtPct(mB.winRate):'—'}</span></div>
            <div class="m"><span>Expectancy</span><span>${mB.total?bt_fmtR(mB.expectancy):'—'}</span></div>
            <div class="m"><span>Max DD</span><span>${mB.total?bt_fmtR(mB.maxDD):'—'}</span></div>
          </div>
        </div>`;
      }
      html += '</div>';
    }

    const filtered = dbState.researchFilter==='all' ? dbHypotheses : dbHypotheses.filter(h=>h.status===dbState.researchFilter);
    if (filtered.length === 0) { html += '<div class="bt-note">None in this status.</div>'; return html; }
    filtered.slice().reverse().forEach(h => {
      const tone = db_hypothesisStatusTone(h.status);
      html += `<div class="bt-card" style="cursor:pointer;" onclick="db_openHypothesis('${h.id}')">
        <h3>${bt_esc(h.name)} <span class="bt-frozen-badge" style="background:${tone==='good'?'var(--green)':tone==='warn'?'var(--danger)':'var(--blue)'};">${bt_esc(h.status)}</span></h3>
        <div class="meta">${h.instrument?bt_esc(h.instrument)+' · ':''}${h.versionLabel} · ${h.testResults.length} test${h.testResults.length!==1?'s':''} · ${h.originalObservation?'from an observation':'started blank'}</div>
      </div>`;
    });
    return html;
  }

  function db_renderHypothesisDetailView() {
    const h = db_findHypothesis(dbState.hypId);
    if (!h) { dbState.view = 'research'; return db_renderResearchListView(); }
    let html = `<button class="bt-tab" onclick="dbState.view='research'; db_render();">← All Research</button>`;

    html += `<div class="bt-card">
      <input class="bt-input" style="font-size:17px;font-weight:600;" value="${bt_esc(h.name)}" onchange="db_updateHypothesisField('${h.id}','name',this.value)">
      <label class="bt-field-label">Status</label>
      <select class="bt-select" onchange="db_setHypothesisStatus('${h.id}', this.value)">
        ${DB_HYP_STATUSES.map(s=>`<option value="${s}" ${h.status===s?'selected':''}>${s}</option>`).join('')}
      </select>
      <div class="bt-note">Positive results alone don't make this an "edge" — the status is your honest read of where the research actually stands.</div>
      <div class="bt-row-btns">
        <button onclick="db_createHypothesisVersion('${h.id}')">💾 Save as New Version (${h.versionLabel})</button>
        <button onclick="db_exportHypothesis('${h.id}')">⬇ Export</button>
      </div>
      <button class="bt-btn-danger" style="width:100%;padding:8px;border:none;border-radius:8px;margin-top:6px;" onclick="db_deleteHypothesis('${h.id}')">Delete</button>
    </div>`;

    if (h.originalObservation) {
      const o = h.originalObservation;
      html += `<div class="bt-card"><h3>Original Observation (preserved, never edited by research)</h3>
        <div class="bt-trade-row" style="flex-direction:column;align-items:stretch;">
          <span>${bt_esc(o.text)}</span>
          <span style="font-size:11px;color:var(--text-dim);">${bt_esc(o.subject||'')} · ${bt_esc(o.date)} · ${bt_esc(o.direction||'')} · ${o.tags.join(', ')} · confidence: ${bt_esc(o.confidence||'not set')}</span>
        </div>
      </div>`;
    }

    html += `<div class="bt-card"><h3>Hypothesis Rules</h3>`;
    DB_HYP_RULE_FIELDS.forEach(([field, label]) => {
      html += bt_fieldPreviewHtml('dbhyp', h.id, field, label, h[field], false);
    });
    html += '</div>';

    html += `<div class="bt-card"><h3>Reasoning (recorded before testing)</h3>
      ${bt_fieldPreviewHtml('dbhyp', h.id, 'whyThink', 'Why did I think this might exist?', h.whyThink, false)}
      ${bt_fieldPreviewHtml('dbhyp', h.id, 'whatWouldProveWrong', 'What would prove me wrong?', h.whatWouldProveWrong, false)}
      <label class="bt-field-label">What else could explain this?</label>
      <div class="bt-pill-row">
        ${h.alternativeExplanations.map((a,i)=>`<button class="bt-pill on" onclick="db_removeAltExplanation('${h.id}',${i})">${bt_esc(a)} ✕</button>`).join('') || '<span class="bt-note" style="margin:0;">None recorded</span>'}
      </div>
      <div style="display:flex;gap:8px;">
        <input class="bt-input" style="margin-bottom:8px;" id="dbAltExpInput" placeholder="e.g. Risk-off behavior" onkeydown="if(event.key==='Enter'){db_addAltExplanation('${h.id}');}">
        <button style="padding:0 14px;border:none;border-radius:8px;background:rgba(255,255,255,0.08);color:inherit;" onclick="db_addAltExplanation('${h.id}')">Add</button>
      </div>
    </div>`;

    html += `<div class="bt-card"><h3>Context</h3>
      <label class="bt-field-label">Market regime</label>
      <select class="bt-select" onchange="db_updateHypothesisField('${h.id}','regime',this.value); db_render();">
        <option value="">—</option>
        ${['Trending','Ranging','High Volatility','Low Volatility','Risk-on','Risk-off','Bull','Bear','Crisis','Normal','Unclear'].map(r=>`<option value="${r}" ${h.regime===r?'selected':''}>${r}</option>`).join('')}
      </select>
      ${bt_fieldPreviewHtml('dbhyp', h.id, 'infoAvailable', 'Information available at the time of decision', h.infoAvailable, false)}
      <label class="bt-field-label">Estimated cost per trade (R) — for gross vs net</label>
      <input class="bt-input" type="number" step="0.01" value="${bt_esc(h.estCostPerTradeR)}" onchange="db_updateHypothesisField('${h.id}','estCostPerTradeR',this.value); db_render();">
      ${dbHypotheses.length>1 ? `<label class="bt-field-label">Parent hypothesis (this one grew out of)</label>
      <select class="bt-select" onchange="db_updateHypothesisField('${h.id}','parentHypothesisId',this.value)">
        <option value="">—</option>
        ${dbHypotheses.filter(x=>x.id!==h.id).map(x=>`<option value="${x.id}" ${h.parentHypothesisId===x.id?'selected':''}>${bt_esc(x.name)}</option>`).join('')}
      </select>` : ''}
    </div>`;

    if (h.parentHypothesisId) {
      let chain = [h];
      let cur = h;
      while (cur.parentHypothesisId) {
        const p = db_findHypothesis(cur.parentHypothesisId);
        if (!p || chain.includes(p)) break;
        chain.push(p); cur = p;
      }
      html += `<div class="bt-note" style="max-width:460px;margin:0 auto 14px;">🧬 Lineage: ${chain.slice().reverse().map(x=>bt_esc(x.name)).join(' → ')}</div>`;
    }

    let provHtml = [['provider','Data Provider'],['symbol','Symbol'],['exchange','Exchange'],['timezone','Timezone'],['importDate','Import Date'],['source','Source / File'],['adjusted','Adjusted / Unadjusted'],['dataVersion','Data Version']]
      .map(([f,l]) => `<label class="bt-field-label">${l}</label><input class="bt-input" value="${bt_esc(h.provenance[f])}" onchange="db_updateHypothesisProvenance('${h.id}','${f}',this.value)">`).join('');
    html += bt_accordion('dbhyp-prov-'+h.id, '🗂 Data Provenance', provHtml, false);

    html += `<div class="bt-card"><h3>Log a Test Result</h3>
      <label class="bt-field-label">Date</label><input class="bt-input" type="date" id="dbTestDate" value="${new Date().toISOString().slice(0,10)}">
      <label class="bt-field-label">Result (R)</label><input class="bt-input" type="number" step="0.1" id="dbTestR" placeholder="e.g. 1.5 or -1">
      <div style="display:flex;gap:8px;">
        <div style="flex:1;"><label class="bt-field-label">MAE (optional)</label><input class="bt-input" type="number" step="any" id="dbTestMAE"></div>
        <div style="flex:1;"><label class="bt-field-label">MFE (optional)</label><input class="bt-input" type="number" step="any" id="dbTestMFE"></div>
      </div>
      <label class="bt-field-label">Time to outcome (optional, e.g. candles or hours)</label><input class="bt-input" type="number" step="any" id="dbTestTime">
      <label class="bt-field-label">Data type</label>
      <select class="bt-select" id="dbTestDataType">
        ${DB_TEST_DATA_TYPES.map(t=>`<option value="${t}">${t}</option>`).join('')}
      </select>
      <label class="bt-field-label">Regime (optional)</label>
      <select class="bt-select" id="dbTestRegime">
        <option value="">—</option>
        ${['Trending','Ranging','High Volatility','Low Volatility','Risk-on','Risk-off','Unclear'].map(r=>`<option value="${r}">${r}</option>`).join('')}
      </select>
      <button class="bt-btn-primary" style="width:100%;padding:10px;border:none;border-radius:8px;" onclick="db_addTestResult('${h.id}')">Add Test Result</button>
    </div>`;

    if (h.testResults.length > 0) {
      let resultsHtml = '';
      const tabs = [['all','All'],...DB_TEST_DATA_TYPES.map(t=>[t,t])];
      resultsHtml += `<div class="bt-tab-row">`;
      tabs.forEach(([k,l]) => { resultsHtml += `<button class="bt-tab ${(dbState.testTab||'all')===k?'on':''}" onclick="dbState.testTab='${k}'; db_render();">${l}</button>`; });
      resultsHtml += '</div>';
      const activeTab = dbState.testTab || 'all';
      const filtered = activeTab==='all' ? h.testResults : h.testResults.filter(r=>r.dataType===activeTab);
      resultsHtml += db_renderTestResultsStats(h, filtered, tabs.find(t=>t[0]===activeTab)[1]+' Results');
      if (activeTab==='all') {
        resultsHtml += `<div class="bt-note" style="margin-top:10px;">Results stay separated by data type above — mixing development and out-of-sample/forward-test numbers can make a hypothesis look better than it really is.</div>`;
      }
      resultsHtml += `<label class="bt-field-label" style="margin-top:10px;">Log</label>`;
      bt_sortByDate(filtered).reverse().forEach(r => {
        resultsHtml += `<div class="bt-trade-row"><span>#${r.num} ${bt_esc(r.date)} · ${r.dataType}${r.regime?' · '+bt_esc(r.regime):''}</span><span class="${r.resultR>0?'r-pos':r.resultR<0?'r-neg':'r-zero'}">${bt_fmtR(r.resultR)} <button style="border:none;background:none;color:var(--danger);margin-left:6px;" onclick="db_deleteTestResult('${h.id}','${r.id}')">✕</button></span></div>`;
      });

      // Pattern decay check: first half vs second half of ALL results, by date
      if (h.testResults.length >= 20) {
        const sorted = bt_sortByDate(h.testResults);
        const mid = Math.floor(sorted.length/2);
        const early = bt_computeMetrics(sorted.slice(0,mid));
        const recent = bt_computeMetrics(sorted.slice(mid));
        const delta = recent.expectancy - early.expectancy;
        resultsHtml += `<div class="bt-note" style="margin-top:10px;font-weight:600;color:inherit;">Pattern Decay Check (first half vs recent half)</div>
          <div class="bt-compare-cols">
            <div class="bt-compare-col"><h4>EARLIER</h4><div class="m"><span>Trades</span><span>${early.total}</span></div><div class="m"><span>Expectancy</span><span>${bt_fmtR(early.expectancy)}</span></div></div>
            <div class="bt-compare-col"><h4>RECENT</h4><div class="m"><span>Trades</span><span>${recent.total}</span></div><div class="m"><span>Expectancy</span><span>${bt_fmtR(recent.expectancy)}</span></div></div>
          </div>`;
        if (Math.abs(delta) >= 0.3) {
          resultsHtml += `<div class="bt-warn">Relationship may have changed — investigate. (Not automatically a dead edge; could be variation, regime change, or execution.)</div>`;
        }
      }
      html += bt_accordion('dbhyp-tests-'+h.id, '📊 Test Results ('+h.testResults.length+')', resultsHtml, true);
    }

    let notesHtml = `<label class="bt-field-label">Add a note</label>
      <textarea class="bt-textarea" id="dbResearchNoteInput" placeholder="Discoveries, questions, problems, unexpected results..."></textarea>
      <button class="bt-btn-primary" style="width:100%;padding:8px;border:none;border-radius:8px;margin-bottom:10px;" onclick="db_addResearchNote('${h.id}')">Add Note</button>`;
    h.researchNotes.slice().reverse().forEach(n => {
      notesHtml += `<div class="bt-trade-row" style="flex-direction:column;align-items:stretch;">
        <span>${bt_esc(n.text)}</span>
        <span style="font-size:11px;color:var(--text-dim);display:flex;justify-content:space-between;">${new Date(n.ts).toLocaleString()} <button style="border:none;background:none;color:var(--danger);" onclick="db_deleteResearchNote('${h.id}','${n.id}')">delete</button></span>
      </div>`;
    });
    html += bt_accordion('dbhyp-notes-'+h.id, '📝 Research Notes ('+h.researchNotes.length+')', notesHtml, false);

    if (h.versions.length > 0) {
      let verHtml = '';
      const allSnaps = h.versions.concat([{ label: h.versionLabel, snapshot: Object.fromEntries(DB_HYP_RULE_FIELDS.map(([f])=>[f,h[f]])), changeReason: '(current, unsaved as a version yet)', createdDate: 'now' }]);
      for (let i = allSnaps.length-1; i >= 0; i--) {
        const v = allSnaps[i];
        verHtml += `<div class="bt-trade-row" style="flex-direction:column;align-items:stretch;">
          <span style="font-weight:600;">${bt_esc(v.label)} — ${bt_esc(v.createdDate)}</span>
          <span style="font-size:12px;">${bt_esc(v.changeReason)}</span>`;
        if (i > 0) {
          const diffs = db_versionDiff(allSnaps[i-1].snapshot, v.snapshot);
          if (diffs.length > 0) {
            verHtml += `<span style="font-size:11px;color:var(--text-dim);margin-top:4px;">What changed vs ${bt_esc(allSnaps[i-1].label)}:</span>`;
            diffs.forEach(d => { verHtml += `<span style="font-size:11px;color:var(--text-dim);">${bt_esc(d.label)}: "${bt_esc(String(d.from).slice(0,30))}" → "${bt_esc(String(d.to).slice(0,30))}"</span>`; });
          }
        }
        verHtml += `</div>`;
      }
      html += bt_accordion('dbhyp-versions-'+h.id, '🕘 Version History ('+h.versions.length+')', verHtml, false);
    }

    if (h.status === 'Rejected') {
      html += `<div class="bt-warn">This hypothesis is marked Rejected${h.rejectedDate?' as of '+bt_esc(h.rejectedDate):''}. It stays here as knowledge — failed research is preserved, not deleted.</div>`;
    }

    return html;
  }

  function db_renderBackupView() {
    let html = `<button class="bt-tab" onclick="dbState.view='home'; db_render();">← Back</button>`;
    html += `<div class="bt-card"><h3>Data Bank Backup</h3>
      <div class="bt-note">Your entire Data Bank — entries, glossary, events, templates, saved groups, instruments, metrics, and every hypothesis with its full research history — lives only in this browser. Back it up regularly.</div>
      <button class="bt-btn-primary" style="width:100%;padding:12px;border:none;border-radius:8px;margin-bottom:10px;" onclick="db_downloadBackup()">Download Full Backup (JSON)</button>
      <label class="bt-field-label">Restore from a backup file</label>
      <input class="bt-input" type="file" accept="application/json" onchange="db_restoreBackupFile(this)">
      <div class="bt-note">Restoring replaces all current Data Bank data with what's in the file.</div>
    </div>`;
    return html;
  }

  // ============ INIT ============
  counter_render();
  odds_render();
  bt_renderDashboard();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
</script>
</body>
</html>
