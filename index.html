  function bt_renderProjectView() {
    const proj = bt_findProject(btState.projectId);
    if (!proj) { btState.view = 'projects'; return bt_renderProjectsView(); }
    localStorage.setItem('btLastOpened', JSON.stringify({ projectId: proj.id }));
    let html = `<button class="bt-tab" onclick="btState.view='projects'; bt_render();">← All Projects</button>`;
    html += `<div class="bt-card">`;
    html += `<label class="bt-field-label">Project name</label><input class="bt-input" style="font-size:17px;font-weight:600;" value="${bt_esc(proj.name)}" onchange="bt_updateProjectField('name', this.value)">`;
    html += `<label class="bt-field-label">Asset / Market</label><input class="bt-input" value="${bt_esc(proj.asset)}" onchange="bt_updateProjectField('asset', this.value)">`;
    html += `<label class="bt-field-label">Higher timeframe</label><input class="bt-input" value="${bt_esc(proj.higherTF)}" onchange="bt_updateProjectField('higherTF', this.value)">`;
    html += `<label class="bt-field-label">Entry timeframe</label><input class="bt-input" value="${bt_esc(proj.lowerTF)}" onchange="bt_updateProjectField('lowerTF', this.value)">`;
    html += bt_fieldPreviewHtml('project', null, 'notes', 'Notes', proj.notes, false);
    html += `<div class="bt-row-btns" style="margin-top:6px;">
      <button onclick="bt_archiveProject('${proj.id}')">${proj.archived?'Unarchive':'Archive'}</button>
      <button onclick="bt_trashProject('${proj.id}')">Move to Trash</button>
      <button class="bt-btn-danger" onclick="bt_permanentDeleteProject('${proj.id}')">Delete Forever</button>
    </div>`;
    html += '</div>';

    // Research Warnings (simple overfitting / sample-size heuristics)
    const warnings = bt_buildWarnings(proj);
    if (warnings.length > 0) {
      html += `<div class="bt-card"><h3>Research Warnings</h3>`;
      warnings.forEach(w => { html += `<div class="bt-warn">${bt_esc(w)}</div>`; });
      html += '</div>';
    }

    html += `<div class="bt-card"><h3>Strategy Versions</h3>`;
    if (proj.versions.length === 0) {
      html += '<div class="bt-note">No versions yet. Create your first one below.</div>';
    }
    proj.versions.forEach(v => {
      const m = bt_computeMetrics(v.trades.filter(t=>t.dataType==='in-sample'));
      html += `<div class="bt-trade-row" style="flex-direction:column;align-items:stretch;">
        <div style="display:flex;justify-content:space-between;cursor:pointer;" onclick="bt_openVersion('${v.id}')">
          <span><input type="checkbox" ${(btState.compareIds||[]).includes(v.id)?'checked':''} onclick="event.stopPropagation(); bt_toggleCompareId('${v.id}')" style="margin-right:6px;">${bt_esc(v.label)}${v.frozen?'<span class=\"bt-frozen-badge\">FROZEN</span>':''}</span>
          <span>${m.total} trades · ${m.total? bt_fmtR(m.expectancy)+'/trade' : ''}</span>
        </div>
        <button style="margin-top:4px;align-self:flex-end;font-size:11px;padding:4px 10px;border:1px solid rgba(148,255,210,0.2);border-radius:6px;background:rgba(255,255,255,0.06);color:inherit;" onclick="bt_duplicateVersion('${v.id}')">Duplicate as new version</button>
      </div>`;
    });
    if ((btState.compareIds||[]).length >= 2) {
      html += `<button class="bt-btn-primary" style="width:100%;padding:10px;border:none;border-radius:8px;margin-top:8px;" onclick="btState.view='compare'; bt_render();">Compare Selected (${btState.compareIds.length})</button>`;
    }
    html += `<label class="bt-field-label" style="margin-top:12px;">New version label</label>
      <input class="bt-input" id="btNewVersionLabel" placeholder="e.g. V1.0">`;
    if (proj.versions.length > 0) {
      html += `<label class="bt-field-label">Copy rulebook from (optional)</label>
        <select class="bt-select" id="btCopyFromVersion">
          <option value="">— Start blank —</option>
          ${proj.versions.map(v => `<option value="${v.id}">${bt_esc(v.label)}</option>`).join('')}
        </select>`;
    }
    html += `<button class="bt-btn-primary" style="width:100%;padding:10px;border:none;border-radius:8px;" onclick="bt_addVersion()">Create Version</button>`;
    html += '</div>';


    // Research Hypotheses
    if (!proj.hypotheses) proj.hypotheses = [];
    html += `<div class="bt-card"><h3>Research Hypotheses</h3>`;
    html += `<div class="bt-note">Record observations and hunches as you go — then track whether the data actually supports them.</div>`;
    proj.hypotheses.slice().reverse().forEach(h => {
      const statusOptions = ['Observation only','Currently testing','Supported by data','Not supported','Unclear'];
      const linkedVer = proj.versions.find(v => v.id === h.versionId);
      html += `<div class="bt-hyp-card">
        ${h.observation ? `<div><b>Observation:</b> ${bt_esc(h.observation)}</div>` : ''}
        ${h.hypothesis ? `<div><b>Hypothesis:</b> ${bt_esc(h.hypothesis)}</div>` : ''}
        ${linkedVer ? `<div style="color:#888;font-size:11px;">Related: ${bt_esc(linkedVer.label)}</div>` : ''}
        <div style="margin-top:6px;">
          <select class="bt-select" style="width:auto;display:inline-block;margin-bottom:0;" onchange="bt_updateHypStatus('${h.id}', this.value)">
            ${statusOptions.map(s => `<option value="${s}" ${h.status===s?'selected':''}>${s}</option>`).join('')}
          </select>
          <button style="border:none;background:#eee;border-radius:6px;padding:6px 10px;font-size:12px;" onclick="bt_deleteHypothesis('${h.id}')">Delete</button>
        </div>
      </div>`;
    });
    html += `<label class="bt-field-label">Observation</label><textarea class="bt-textarea" id="btHypObs" placeholder="What did you notice?"></textarea>`;
    html += `<label class="bt-field-label">Hypothesis</label><textarea class="bt-textarea" id="btHypText" placeholder="What might explain it?"></textarea>`;
    if (proj.versions.length > 0) {
      html += `<label class="bt-field-label">Related version (optional)</label>
        <select class="bt-select" id="btHypVersion">
          <option value="">—</option>
          ${proj.versions.map(v => `<option value="${v.id}">${bt_esc(v.label)}</option>`).join('')}
        </select>`;
    }
    html += `<button class="bt-btn-primary" style="width:100%;padding:10px;border:none;border-radius:8px;" onclick="bt_addHypothesis()">Add Hypothesis</button>`;
    html += '</div>';
    return html;
  }

  function bt_renderVersionView() {

    if (!ver) { btState.view = 'project'; return bt_renderProjectView(); }

    let html = `<button class="bt-tab" onclick="btState.view='project'; bt_render();">← ${bt_esc(proj.name)}</button>`;
    const storageKB = bt_estimateStorageKB();
    if (storageKB > 4000) {
      html += `<div class="bt-warn">Storage is getting full (${(storageKB/1024).toFixed(1)}MB used). Screenshots take up the most space — consider removing older ones, or download a backup and clear some data.</div>`;
    }
    html += `<h3 style="margin:4px 0 10px;">${bt_esc(ver.label)} ${ver.frozen?'<span class=\"bt-frozen-badge\">FROZEN</span>':''}</h3>`;

    let rbHtml = '';
    if (ver.frozen) {
      rbHtml += `<div class="bt-warn">This version is frozen for testing. Editing the rulebook may affect the validity of your research. If you need to change rules, create a new version instead.</div>`;
    }
    const rb = ver.rulebook;
    const rbField = (key, label) => bt_fieldPreviewHtml('rulebook', null, key, label, rb[key], ver.frozen);
    rbHtml += rbField('market','Market');
    rbHtml += rbField('timeframes','Timeframes');
    rbHtml += rbField('setupConditions','Setup Conditions');
    rbHtml += rbField('entryRule','Entry Rule');
    rbHtml += rbField('stopLossRule','Stop Loss Rule');
    rbHtml += rbField('takeProfitRule','Take Profit Rule');
    rbHtml += rbField('riskReward','Risk/Reward');
    rbHtml += rbField('invalidConditions','Invalid Conditions');
    rbHtml += rbField('setupExpiration','Setup Expiration');
    rbHtml += rbField('notes','Additional Notes');
    rbHtml += `<button class="${ver.frozen?'':'bt-btn-primary'}" style="width:100%;padding:10px;border:none;border-radius:8px;margin-top:6px;background:${ver.frozen?'#ddd':''}" onclick="bt_toggleFreeze()">${ver.frozen?'Unfreeze Version':'Freeze This Version'}</button>`;
    rbHtml += `<button class="bt-btn-danger" style="width:100%;padding:8px;border:none;border-radius:8px;margin-top:6px;" onclick="bt_deleteVersion('${ver.id}')">Delete Version</button>`;
    html += bt_accordion('rulebook', '📖 Rulebook', rbHtml, false);

    // Fast trade entry
    html += `<div class="bt-card"><h3>Log a Trade</h3>`;
    html += `<label class="bt-field-label">Date</label><input class="bt-input" type="date" id="btTradeDate" value="${new Date().toISOString().slice(0,10)}">`;

    html += `<label class="bt-field-label">Data type</label><div class="bt-pill-row">
      <button class="bt-pill ${btState.tempDataType==='in-sample'?'on':''}" onclick="bt_setTempDataType('in-sample')">In-Sample</button>
      <button class="bt-pill ${btState.tempDataType==='out-of-sample'?'on':''}" onclick="bt_setTempDataType('out-of-sample')">Out-of-Sample</button>
      <button class="bt-pill ${btState.tempDataType==='forward-test'?'on':''}" onclick="bt_setTempDataType('forward-test')">Forward Test</button>

    html += `<div class="bt-row-btns">
      <button class="bt-btn-primary" onclick="bt_logTrade(1)">WIN (+1R)</button>
      <button class="bt-btn-danger" onclick="bt_logTrade(-1)">LOSS (-1R)</button>

    </div>`;
    html += `<label class="bt-field-label" style="margin-top:10px;">Or log a custom R result</label>
      <div style="display:flex;gap:8px;">
        <input class="bt-input" style="margin-bottom:0;" type="number" step="0.1" id="btCustomR" placeholder="e.g. 2.5 or -0.5">
        <button class="bt-btn-primary" style="padding:0 16px;border:none;border-radius:8px;" onclick="bt_logCustomR()">Log</button>
      </div>`;
    html += '</div>';

    // Data tabs + metrics
    const tabs = [['in-sample','In-Sample'],['out-of-sample','Out-of-Sample'],['forward-test','Forward Test'],['combined','Combined (all)']];
    html += `<div class="bt-tab-row">`;
    tabs.forEach(([key,label]) => {
      html += `<button class="bt-tab ${btState.dataTab===key?'on':''}" onclick="bt_setDataTab('${key}')">${label}</button>`;
    });
    html += '</div>';

    html += `<div class="bt-card"><h3>Strategy Health</h3>${bt_strategyHealthPanel(ver)}</div>`;

    const filteredTrades = bt_sortByDate(btState.dataTab === 'combined' ? ver.trades : ver.trades.filter(t => t.dataType === btState.dataTab));
    const m = bt_computeMetrics(filteredTrades);

    html += `<div class="bt-card"><h3>${tabs.find(t=>t[0]===btState.dataTab)[1]} Results</h3>`;
    if (btState.dataTab === 'combined') {
      html += `<div class="bt-note">Combined results mix in-sample, out-of-sample, and forward-test data. Use this for a quick overview only — not for judging whether the strategy actually works.</div>`;
    }
    if (m.total === 0) {
      html += '<div class="bt-note">No trades logged in this category yet.</div>';
    } else {
      const expTone = m.expectancy > 0 ? 'tone-good' : m.expectancy < 0 ? 'tone-warn' : '';
      html += `<div class="bt-hero"><div class="hv ${expTone}">${bt_fmtR(m.expectancy)}</div><div class="hl">Expectancy / Trade</div></div>`;
      html += `<div class="bt-metric-grid">
        <div class="bt-metric-box"><div class="v">${m.total}</div><div class="l">Total Trades</div></div>
        <div class="bt-metric-box"><div class="v">${bt_fmtPct(m.winRate)}</div><div class="l">Win Rate</div></div>
        <div class="bt-metric-box"><div class="v">${bt_fmtR(m.totalR)}</div><div class="l">Total R</div></div>
        <div class="bt-metric-box"><div class="v">${bt_fmtR(m.avgWin)}</div><div class="l">Avg Win</div></div>
        <div class="bt-metric-box"><div class="v">${bt_fmtR(m.avgLoss)}</div><div class="l">Avg Loss</div></div>
        <div class="bt-metric-box tone-warn"><div class="v">${bt_fmtR(m.maxDD)}</div><div class="l">Max Drawdown</div></div>
        <div class="bt-metric-box ${m.currentDD<0?'tone-caution':''}"><div class="v">${bt_fmtR(m.currentDD)}</div><div class="l">Current Drawdown</div></div>
        <div class="bt-metric-box tone-good"><div class="v">${m.longestWin}</div><div class="l">Longest Win Streak</div></div>
        <div class="bt-metric-box tone-warn"><div class="v">${m.longestLoss}</div><div class="l">Longest Loss Streak</div></div>
      </div>`;
      html += `<div class="bt-note" style="margin-top:0;">Expectancy is a historical average, not a guaranteed future result. ${bt_fmtR(m.expectancy)} per trade means: on average, this is what each trade returned across this sample.</div>`;
      html += `<label class="bt-field-label">Equity Curve (cumulative R)</label>`;
      html += bt_equitySvg(m.equity);
      html += `<label class="bt-field-label" style="margin-top:10px;">R-Multiple Distribution</label>`;
      html += bt_histogramSvg(filteredTrades);
      html += `<label class="bt-field-label" style="margin-top:10px;">Result Sequence</label><div class="bt-seq">${m.sequence.join(' ')}</div>`;
    }
    html += `<button class="bt-row-btns" style="width:100%;padding:8px;border:none;border-radius:8px;margin-top:10px;background:#333;color:white;" onclick="bt_exportVersionCSV()">Export All Trades (CSV)</button>`;
    html += '</div>';

    html += bt_accordion('montecarlo', '🎲 Monte Carlo Simulation', bt_monteCarloCard(filteredTrades), false);

    // Winner/Loser condition comparison — stack multiple conditions with AND logic
    let condHtml = `<div class="bt-note">Stack conditions to test combinations, not just one field at a time — e.g. Volatility=High AND Session=London. Watch the sample size shrink as you add conditions.</div>`;
    if (m.total === 0) {
      condHtml += '<div class="bt-note">Log some trades first to compare conditions.</div>';
    } else {
      if (btState.condChips.length > 0) {
        condHtml += `<label class="bt-field-label">Active conditions (AND)</label><div class="bt-pill-row">`;
        btState.condChips.forEach((c, i) => {
          const fLabel = BT_CONDITION_FIELDS.find(f=>f[0]===c.field)[1];
          condHtml += `<button class="bt-pill on" onclick="bt_removeCondChip(${i})">${fLabel}=${bt_esc(c.value)} ✕</button>`;
        });
        condHtml += `</div><button class="bt-tab" onclick="bt_clearCondChips()">Clear All</button>`;
      }

      condHtml += `<label class="bt-field-label" style="margin-top:8px;">Add a condition — field</label><div class="bt-pill-row">`;
      BT_CONDITION_FIELDS.forEach(([key,label]) => {
        condHtml += `<button class="bt-pill ${btState.condField===key?'on':''}" onclick="bt_setCondField('${key}')">${label}</button>`;
      });
      condHtml += '</div>';

      const values = bt_distinctValues(filteredTrades, btState.condField);
      if (values.length === 0) {
        condHtml += '<div class="bt-note">No trades have this field filled in yet — tap a trade in the log below to add it.</div>';
      } else {
        condHtml += `<label class="bt-field-label">Value</label><div class="bt-pill-row">`;
        values.forEach(v => {
          condHtml += `<button class="bt-pill ${btState.condValue===v?'on':''}" onclick="bt_setCondValue('${bt_esc(v)}')">${bt_esc(v)}</button>`;
        });
        condHtml += '</div>';
        condHtml += `<button class="bt-btn-primary" style="width:100%;padding:8px;border:none;border-radius:8px;margin-bottom:10px;" onclick="bt_addCondChip()">+ Add This Condition</button>`;
      }

      if (btState.condChips.length > 0) {
        const cmp = bt_multiConditionCompare(filteredTrades, btState.condChips);
        const warn = bt_sampleSizeWarning(cmp.matched.total, btState.condChips.length);
        const warnClass = warn.tone === 'warn' ? 'bt-warn' : 'bt-note';
        condHtml += `<div class="${warnClass}">${warn.text}</div>`;
        condHtml += `<div class="bt-compare-cols">
          <div class="bt-compare-col"><h4>MATCHES ALL</h4>
            <div class="m"><span>Trades</span><span>${cmp.matched.total||0}</span></div>
            <div class="m"><span>Win Rate</span><span>${cmp.matched.total?bt_fmtPct(cmp.matched.winRate):'—'}</span></div>
            <div class="m"><span>Avg R/trade</span><span>${cmp.matched.total?bt_fmtR(cmp.matched.expectancy):'—'}</span></div>
          </div>
          <div class="bt-compare-col"><h4>EVERYTHING ELSE</h4>
            <div class="m"><span>Trades</span><span>${cmp.rest.total||0}</span></div>
            <div class="m"><span>Win Rate</span><span>${cmp.rest.total?bt_fmtPct(cmp.rest.winRate):'—'}</span></div>
            <div class="m"><span>Avg R/trade</span><span>${cmp.rest.total?bt_fmtR(cmp.rest.expectancy):'—'}</span></div>
          </div>
        </div>`;
        condHtml += `<div class="bt-note" style="margin-top:10px;">This combination appeared in ${cmp.pctOfWinners===null?'—':cmp.pctOfWinners.toFixed(1)+'%'} of winning trades, and ${cmp.pctOfLosers===null?'—':cmp.pctOfLosers.toFixed(1)+'%'} of losing trades.</div>`;
      }
    }
    html += bt_accordion('condition', '🔍 Condition Comparison', condHtml, false);

    // Trade list
    html += `<div class="bt-card"><h3>Trade Log</h3>`;
    if (filteredTrades.length === 0) {
      html += '<div class="bt-note">No trades in this category yet.</div>';
    } else {
      filteredTrades.slice().reverse().forEach(t => {
        const rClass = t.resultR > 0 ? 'r-pos' : (t.resultR < 0 ? 'r-neg' : 'r-zero');
        html += `<div class="bt-trade-row" style="cursor:pointer;flex-direction:column;align-items:stretch;" onclick="bt_toggleTradeExpand('${t.id}')">
          <div style="display:flex;justify-content:space-between;">
            <span>#${t.num} · ${bt_esc(t.date)} · ${t.direction==='long'?'Long':'Short'}</span>
            <span class="${rClass}">${bt_fmtR(t.resultR)}</span>
          </div>`;
        if (t.expanded) {
          html += `<div class="bt-edit-panel" onclick="event.stopPropagation()">
            <label class="bt-field-label">Date</label><input class="bt-input" type="date" value="${bt_esc(t.date)}" onchange="bt_updateTradeField('${t.id}','date',this.value)">
            <label class="bt-field-label">Result (R)</label><input class="bt-input" type="number" step="0.1" value="${t.resultR}" onchange="bt_updateTradeField('${t.id}','resultR',this.value)">
            <label class="bt-field-label">Direction</label>
            <div class="bt-pill-row">
              <button class="bt-pill ${t.direction==='long'?'on':''}" onclick="bt_updateTradeField('${t.id}','direction','long'); bt_render();">Long</button>
              <button class="bt-pill ${t.direction==='short'?'on':''}" onclick="bt_updateTradeField('${t.id}','direction','short'); bt_render();">Short</button>
            </div>
            <label class="bt-field-label">Data type</label>
            <div class="bt-pill-row">
              <button class="bt-pill ${t.dataType==='in-sample'?'on':''}" onclick="bt_updateTradeField('${t.id}','dataType','in-sample'); bt_render();">In-Sample</button>
              <button class="bt-pill ${t.dataType==='out-of-sample'?'on':''}" onclick="bt_updateTradeField('${t.id}','dataType','out-of-sample'); bt_render();">Out-of-Sample</button>
              <button class="bt-pill ${t.dataType==='forward-test'?'on':''}" onclick="bt_updateTradeField('${t.id}','dataType','forward-test'); bt_render();">Forward Test</button>
            </div>
            <label class="bt-field-label">Market environment</label>
            <div class="bt-pill-row">
              <button class="bt-pill ${t.marketEnv==='Trending'?'on':''}" onclick="bt_updateTradeField('${t.id}','marketEnv','Trending'); bt_render();">Trending</button>
              <button class="bt-pill ${t.marketEnv==='Ranging'?'on':''}" onclick="bt_updateTradeField('${t.id}','marketEnv','Ranging'); bt_render();">Ranging</button>
              <button class="bt-pill ${t.marketEnv==='Unclear'?'on':''}" onclick="bt_updateTradeField('${t.id}','marketEnv','Unclear'); bt_render();">Unclear</button>
            </div>
            <label class="bt-field-label">Volatility</label>
            <div class="bt-pill-row">
              <button class="bt-pill ${t.volatility==='High'?'on':''}" onclick="bt_updateTradeField('${t.id}','volatility','High'); bt_render();">High</button>
              <button class="bt-pill ${t.volatility==='Medium'?'on':''}" onclick="bt_updateTradeField('${t.id}','volatility','Medium'); bt_render();">Medium</button>
              <button class="bt-pill ${t.volatility==='Low'?'on':''}" onclick="bt_updateTradeField('${t.id}','volatility','Low'); bt_render();">Low</button>
            </div>
            <label class="bt-field-label">Session</label><input class="bt-input" value="${bt_esc(t.session)}" placeholder="e.g. London" onchange="bt_updateTradeField('${t.id}','session',this.value); bt_render();">

            <label class="bt-field-label">Setup type (add as many as apply)</label>
            <div class="bt-pill-row">
              ${bt_tradeTags(t).map(tag => `<button class="bt-pill on" onclick="bt_removeTradeTag('${t.id}','${bt_esc(tag)}')">${bt_esc(tag)} ✕</button>`).join('') || '<span class="bt-note" style="margin:0;">No tags yet</span>'}
            </div>
            <div style="display:flex;gap:8px;">
              <input class="bt-input" style="margin-bottom:8px;" id="newTagInput-${t.id}" placeholder="e.g. Breakout retest" onkeydown="if(event.key==='Enter'){bt_addTradeTag('${t.id}', this.value); this.value='';}">
              <button style="padding:0 14px;border:none;border-radius:8px;background:rgba(255,255,255,0.08);color:inherit;" onclick="const i=document.getElementById('newTagInput-${t.id}'); bt_addTradeTag('${t.id}', i.value); i.value='';">Add</button>
            </div>

            ${t.resultR < 0 ? `<label class="bt-field-label">What went wrong?</label>
            <div class="bt-pill-row">
              ${BT_LOSS_REASONS.map(r => `<button class="bt-pill ${t.lossReason===r?'on':''}" onclick="bt_setLossReason('${t.id}','${bt_esc(r)}')">${r}</button>`).join('')}
            </div>` : ''}

            <div class="bt-note" style="margin-top:10px;font-weight:600;color:inherit;">Screenshots</div>
            ${['setup','result'].map(stage => {
              const shots = t.screenshots || { setup:'', result:'' };
              const stageLabel = stage === 'setup' ? 'Setup / Entry' : 'Result / Outcome';
              return `<label class="bt-field-label">${stageLabel}</label>
                ${shots[stage] ? `<img src="${shots[stage]}" style="max-width:100%;border-radius:8px;margin-bottom:4px;display:block;">
                  <button style="margin-bottom:8px;" onclick="bt_removeTradeScreenshot('${t.id}','${stage}')">Remove image</button>`
                : `<input class="bt-input" type="file" accept="image/*" onchange="bt_handleTradeScreenshotUpload('${t.id}','${stage}', this)">`}`;
            }).join('')}

            ${bt_fieldPreviewHtml('trade', t.id, 'notes', 'Notes', t.notes, false)}
            <button class="bt-btn-danger" style="width:100%;padding:8px;border:none;border-radius:8px;margin-top:6px;" onclick="bt_deleteTrade('${t.id}')">Delete Trade</button>
          </div>`;
        }
        html += `</div>`;
      });
    }
    html += '</div>';

    // ============ LIVE TRADING JOURNAL ============
    if (!ver.liveTrades) ver.liveTrades = [];
    const liveSectionStart = html.length;
    if (ver.liveTrades.length > 0) {
      html += `<div class="bt-warn">This version has live trade history. Changing the rulebook above may make future backtest-vs-live comparisons harder to interpret.</div>`;
    }

    html += `<div class="bt-card"><h3>Log a Live Trade</h3>`;
    html += `<label class="bt-field-label">Date</label><input class="bt-input" type="date" id="btLiveTradeDate" value="${new Date().toISOString().slice(0,10)}">`;
    html += `<label class="bt-field-label">Direction</label><div class="bt-pill-row">
      <button class="bt-pill ${btState.liveTempDir==='long'?'on':''}" onclick="bt_setLiveTempDir('long')">Long</button>
      <button class="bt-pill ${btState.liveTempDir==='short'?'on':''}" onclick="bt_setLiveTempDir('short')">Short</button>
    </div>`;

    html += `<button class="bt-tab" style="margin-bottom:8px;" onclick="bt_togglePreTradeCheck()">${btState.showPreTradeCheck?'Hide':'Show'} Pre-Trade Rule Check (optional)</button>`;
    if (btState.showPreTradeCheck) {
      const activeRules = BT_RULE_FIELDS.filter(([key]) => ver.rulebook[key] && ver.rulebook[key].trim());
      if (activeRules.length === 0) {
        html += '<div class="bt-note">No rulebook fields are filled in for this version yet — fill in the rulebook above to check against it here.</div>';
      } else {
        activeRules.forEach(([key,label]) => {
          const cur = btState.tempRuleChecks[key] || { status: '' };
          html += `<div class="bt-note" style="margin-bottom:2px;"><b>${label}:</b> ${bt_esc(ver.rulebook[key]).slice(0,60)}</div>
          <div class="bt-pill-row">
            <button class="bt-pill ${cur.status==='met'?'on':''}" onclick="bt_setRuleCheck('${key}','met')">Met</button>
            <button class="bt-pill ${cur.status==='not-met'?'on':''}" onclick="bt_setRuleCheck('${key}','not-met')">Not Met</button>
            <button class="bt-pill ${cur.status==='unclear'?'on':''}" onclick="bt_setRuleCheck('${key}','unclear')">Unclear</button>
            <button class="bt-pill ${cur.status==='na'?'on':''}" onclick="bt_setRuleCheck('${key}','na')">N/A</button>
          </div>`;
        });
        const s = bt_ruleCheckSummary(btState.tempRuleChecks);
        html += `<div class="bt-note">So far: ${s.met} met, ${s.notMet} not met, ${s.unclear} unclear, ${s.na} N/A${s.pct!==null?' — compliance so far: '+s.pct.toFixed(0)+'%':''}</div>`;
      }
    }

    html += `<label class="bt-field-label">Did you follow your strategy rules on this trade?</label><div class="bt-pill-row">
      <button class="bt-pill ${btState.liveTempFollowed==='yes'?'on':''}" onclick="bt_setLiveTempFollowed('yes')">Yes</button>
      <button class="bt-pill ${btState.liveTempFollowed==='no'?'on':''}" onclick="bt_setLiveTempFollowed('no')">No</button>
    </div>
    <div class="bt-note" style="margin-top:-4px;">Used only if you didn't fill in the rule check above.</div>`;
    html += `<div class="bt-row-btns">
      <button class="bt-btn-primary" onclick="bt_logLiveTrade(1)">WIN (+1R)</button>
      <button class="bt-btn-danger" onclick="bt_logLiveTrade(-1)">LOSS (-1R)</button>
      <button onclick="bt_logLiveTrade(0)">BE (0R)</button>
    </div>`;
    html += `<label class="bt-field-label" style="margin-top:10px;">Or log a custom R result</label>
      <div style="display:flex;gap:8px;">
        <input class="bt-input" style="margin-bottom:0;" type="number" step="0.1" id="btLiveCustomR" placeholder="e.g. 2.5 or -0.5">
        <button class="bt-btn-primary" style="padding:0 16px;border:none;border-radius:8px;" onclick="bt_logLiveCustomR()">Log</button>
      </div>`;
    html += `<div class="bt-note" style="margin-top:10px;">Result = performance. "Followed rules" = process. A loss with rules followed can still be good trading — a win with rules broken isn't automatically good trading.</div>`;
    html += '</div>';

    // Compliance score
    const compToday = bt_complianceScore(ver.liveTrades, 1);
    const compWeek = bt_complianceScore(ver.liveTrades, 7);
    const compMonth = bt_complianceScore(ver.liveTrades, 30);
    const compAll = bt_complianceScore(ver.liveTrades, null);
    html += `<div class="bt-card"><h3>Strategy Compliance</h3>`;
    html += `<div class="bt-metric-grid">
      <div class="bt-metric-box"><div class="v">${compToday===null?'—':compToday.toFixed(0)+'%'}</div><div class="l">Today</div></div>
      <div class="bt-metric-box"><div class="v">${compWeek===null?'—':compWeek.toFixed(0)+'%'}</div><div class="l">This Week</div></div>
      <div class="bt-metric-box"><div class="v">${compMonth===null?'—':compMonth.toFixed(0)+'%'}</div><div class="l">This Month</div></div>
      <div class="bt-metric-box"><div class="v">${compAll===null?'—':compAll.toFixed(0)+'%'}</div><div class="l">All Time</div></div>
    </div>`;
    html += '</div>';

    // Backtest vs Live comparison
    const backtestMetrics = bt_computeMetrics(bt_sortByDate(ver.trades));
    const liveMetrics = bt_computeMetrics(bt_sortByDate(ver.liveTrades));
    html += `<div class="bt-card"><h3>Backtest vs Live</h3>`;
    if (backtestMetrics.total === 0 || liveMetrics.total === 0) {
      html += '<div class="bt-note">Need both backtest and live trades logged on this version to compare.</div>';
    } else {
      html += `<div class="bt-compare-cols">
        <div class="bt-compare-col"><h4>BACKTEST</h4>
          <div class="m"><span>Trades</span><span>${backtestMetrics.total}</span></div>
          <div class="m"><span>Win Rate</span><span>${bt_fmtPct(backtestMetrics.winRate)}</span></div>
          <div class="m"><span>Expectancy</span><span>${bt_fmtR(backtestMetrics.expectancy)}</span></div>
          <div class="m"><span>Max DD</span><span>${bt_fmtR(backtestMetrics.maxDD)}</span></div>
        </div>
        <div class="bt-compare-col"><h4>LIVE</h4>
          <div class="m"><span>Trades</span><span>${liveMetrics.total}</span></div>
          <div class="m"><span>Win Rate</span><span>${bt_fmtPct(liveMetrics.winRate)}</span></div>
          <div class="m"><span>Expectancy</span><span>${bt_fmtR(liveMetrics.expectancy)}</span></div>
          <div class="m"><span>Max DD</span><span>${bt_fmtR(liveMetrics.maxDD)}</span></div>
        </div>
      </div>`;
      html += `<div class="bt-note" style="margin-top:10px;">Difference in expectancy: ${bt_fmtR(liveMetrics.expectancy - backtestMetrics.expectancy)} per trade.</div>`;
      if (liveMetrics.total < 20) {
        html += `<div class="bt-note">Live sample size is still small (${liveMetrics.total} trades). Differences may be due to normal variation, not a real change in the strategy.</div>`;
      }
    }
    html += '</div>';

    // Execution gap analysis
    const rulesFollowedTrades = bt_sortByDate(ver.liveTrades.filter(t => t.rulesFollowed === 'yes'));
    const rulesBrokenTrades = bt_sortByDate(ver.liveTrades.filter(t => t.rulesFollowed === 'no'));
    const followedM = bt_computeMetrics(rulesFollowedTrades);
    const brokenM = bt_computeMetrics(rulesBrokenTrades);
    html += `<div class="bt-card"><h3>Execution Gap</h3>`;
    html += `<div class="bt-note">Is live performance worse because the strategy changed, or because execution slipped? Compare live results when rules were followed vs when they were broken.</div>`;
    if (ver.liveTrades.length === 0) {
      html += '<div class="bt-note">No live trades logged yet.</div>';
    } else {
      html += `<div class="bt-compare-cols">
        <div class="bt-compare-col"><h4>RULES FOLLOWED</h4>
          <div class="m"><span>Trades</span><span>${followedM.total||0}</span></div>
          <div class="m"><span>Expectancy</span><span>${followedM.total?bt_fmtR(followedM.expectancy):'—'}</span></div>
        </div>
        <div class="bt-compare-col"><h4>RULES BROKEN</h4>
          <div class="m"><span>Trades</span><span>${brokenM.total||0}</span></div>
          <div class="m"><span>Expectancy</span><span>${brokenM.total?bt_fmtR(brokenM.expectancy):'—'}</span></div>
        </div>

  // --- Automatic insight generator ---
  function dev_generateInsights(trades) {
    const insights = [];
    const total = trades.length;

    if (total === 0) return insights;

    if (total < 10) {
      insights.push({ text: `${total} trade${total!==1?'s':''} logged. Patterns won't start being meaningful until you have at least 10-15 — keep logging.`, tone: 'neutral' });
    } else if (total < 20) {
      insights.push({ text: `${total} trades logged — early signals may be starting to show, but still too soon to trust fully.`, tone: 'caution' });
    } else {
      insights.push({ text: `${total} trades logged — enough to start drawing tentative conclusions from the strongest patterns below.`, tone: 'good' });
    }

    // Per-field, per-value deltas
    const overall = bt_computeMetrics(trades);
    const fieldChecks = [];
    BT_CONDITION_FIELDS.forEach(([field, label]) => {
      const values = bt_distinctValues(trades, field);
      values.forEach(v => {
        const present = trades.filter(t => bt_hasCondValue(t, field, v));
        const absent = trades.filter(t => !bt_hasCondValue(t, field, v));
        if (present.length < 5) return;
        const mp = bt_computeMetrics(present);
        const wrDelta = overall.winRate !== null && mp.winRate !== null ? mp.winRate - overall.winRate : 0;
        const expDelta = mp.expectancy - overall.expectancy;
        if (Math.abs(expDelta) >= 0.3 || Math.abs(wrDelta) >= 15) {
          fieldChecks.push({
            magnitude: Math.abs(expDelta) + Math.abs(wrDelta)/100,
            n: present.length,
            text: `${label} = "${v}": ${bt_fmtPct(mp.winRate)} win rate, ${bt_fmtR(mp.expectancy)}/trade over ${present.length} trades (overall: ${bt_fmtPct(overall.winRate)}, ${bt_fmtR(overall.expectancy)}/trade)`,
            tone: present.length >= 15 ? (expDelta > 0 ? 'good' : 'warn') : 'caution'
          });
        }
      });
    });
    fieldChecks.sort((a,b) => b.magnitude - a.magnitude);
    fieldChecks.slice(0,5).forEach(f => insights.push({ text: f.text, tone: f.tone }));

    // Direction bias
    const longs = trades.filter(t => t.direction === 'long');
    const shorts = trades.filter(t => t.direction === 'short');
    if (longs.length >= 5 && shorts.length >= 5) {
      const ml = bt_computeMetrics(longs), ms = bt_computeMetrics(shorts);
      if (Math.abs(ml.expectancy - ms.expectancy) >= 0.3) {
        insights.push({ text: `Long trades: ${bt_fmtR(ml.expectancy)}/trade (${longs.length}) vs Short: ${bt_fmtR(ms.expectancy)}/trade (${shorts.length}) — a real gap worth watching.`, tone: (longs.length>=15&&shorts.length>=15) ? 'good' : 'caution' });
      }
    }

    // Missing tag nudge
    if (total >= 10) {
      BT_CONDITION_FIELDS.forEach(([field, label]) => {
        const values = bt_distinctValues(trades, field);
        if (values.length === 0) {
          insights.push({ text: `You haven't tagged ${label} on any trade yet — adding it could reveal patterns you can't see now.`, tone: 'neutral' });
        }
      });
    }

    // Setup tag co-occurrence caution
    const tagCounts = {}, pairCounts = {};
    trades.forEach(t => {
      const tags = bt_tradeTags(t);
      tags.forEach(tag => { tagCounts[tag] = (tagCounts[tag]||0) + 1; });
      for (let i=0;i<tags.length;i++) for (let j=i+1;j<tags.length;j++) {
        const key = [tags[i],tags[j]].sort().join(' + ');
        pairCounts[key] = (pairCounts[key]||0) + 1;
      }
    });
    Object.keys(pairCounts).forEach(key => {
      const [a,b] = key.split(' + ');
      const co = pairCounts[key];
      if (co >= 5 && co >= Math.min(tagCounts[a]||0, tagCounts[b]||0) * 0.9) {
        insights.push({ text: `"${a}" and "${b}" almost always appear together (${co} trades) — hard to tell which one is actually driving results. Try logging a few trades with just one of them.`, tone: 'caution' });
      }
    });

    // Recent streak flag
    const recent = bt_sortByDate(trades).slice(-5);
    const recentLosses = recent.filter(t => t.resultR < 0);
    if (recent.length === 5 && recentLosses.length >= 3) {
      insights.push({ text: `${recentLosses.length} of your last 5 trades lost. Small sample — worth watching, not yet a conclusion.`, tone: 'caution' });
    }

    return insights;
  }

  function db_logHistory(entry, field, oldValue, newValue) {
    if (!entry.history) entry.history = [];
    if ((oldValue||'') === (newValue||'')) return;
    entry.history.push({ id: bt_uid(), ts: new Date().toISOString(), field, oldValue, newValue });
    if (entry.history.length > 100) entry.history = entry.history.slice(-100);
  }

  function db_allTags() {
    const set = new Set();
    dbEntries.forEach(e => (e.tags||[]).forEach(t => set.add(t)));
    dbGlossary.forEach(g => set.add(g.term));
    return Array.from(set);
  }

  function db_canonicalizeTag(rawValue) {
    let v = (rawValue || '').replace(/\s+/g, ' ').trim();
    if (!v) return v;
    const existing = db_allTags();
    const match = existing.find(e => e.replace(/\s+/g,' ').trim().toLowerCase() === v.toLowerCase());
    return match || v;
  }

  function db_computeStreak() {
    if (dbEntries.length === 0) return 0;
    const dates = new Set(dbEntries.map(e => e.date));
    let streak = 0;
    let cur = new Date();
    while (true) {
      const ds = cur.toISOString().slice(0,10);
      if (dates.has(ds)) { streak++; cur.setDate(cur.getDate()-1); }
      else break;
    }
    return streak;
  }

  function db_entrySanityWarnings(d) {
    const warnings = [];
    const num = parseFloat(d.number);
    if (!isNaN(num)) {
      if (d.unit === '%' && Math.abs(num) >= 10) {
        warnings.push(`${num}% is a big move — double check the number before saving.`);
      }
      if (d.linkedInstrumentId) {
        const inst = db_findInstrument(d.linkedInstrumentId);
        if (inst) {
          const sorted = db_sortCandles(inst);
          const idx = sorted.findIndex(c => c.date === d.date);
          if (idx > 0) {
            const c = sorted[idx], prev = sorted[idx-1];
            if (prev.close) {
              const actualPct = (c.close-prev.close)/prev.close*100;
              if (d.unit === '%' && Math.abs(actualPct - num) > 0.5) {
                warnings.push(`You typed ${num}%, but ${bt_esc(inst.name)}'s tracked candle shows ${actualPct.toFixed(2)}% for ${d.date} — worth checking.`);
              }
            }
          }
        }
      }
    }
    return warnings;
  }

      (e.tags||[]).forEach(t => { if (!seen.includes(t)) seen.push(t); });
    });
    return seen.slice(0, limit||10);
  }

  // ============ PHASE 3: COMPARISON ENGINE ============
  function db_computeGroupStats(entries) {
    const total = entries.length;
    if (total === 0) return { total: 0 };
    const up = entries.filter(e=>e.direction==='up').length;
    const down = entries.filter(e=>e.direction==='down').length;
    const neutral = entries.filter(e=>e.direction==='neutral').length;
    const nums = entries.map(e=>parseFloat(e.number)).filter(n=>!isNaN(n));
    const avgNum = nums.length ? nums.reduce((a,b)=>a+b,0)/nums.length : null;
    const wins = entries.filter(e=>e.outcome==='win').length;
    const losses = entries.filter(e=>e.outcome==='loss').length;
    const winRate = (wins+losses) ? wins/(wins+losses)*100 : null;
    const rVals = entries.map(e=>e.resultR).filter(r=>r!==null && r!==undefined && !isNaN(r));
    const totalR = rVals.reduce((a,b)=>a+b,0);
    const expectancy = rVals.length ? totalR/rVals.length : null;
    return { total, up, down, neutral, avgNum, wins, losses, winRate, totalR, expectancy, rCount: rVals.length };
  }

  function db_hasCondValue(e, field, value) {
    if (field === 'tags') return (e.tags||[]).includes(value);
    return (e[field]||'').toString().trim() === value;
  }
  function db_matchesAllChips(e, chips) { return chips.every(c => db_hasCondValue(e, c.field, c.value)); }

  function db_distinctValues(entries, field) {
    const set = new Set();
    if (field === 'tags') entries.forEach(e => (e.tags||[]).forEach(t=>set.add(t)));
    else entries.forEach(e => { if (e[field] && e[field].toString().trim()) set.add(e[field].toString().trim()); });
    return Array.from(set);
  }

  function db_multiConditionCompare(entries, chips) {
    if (chips.length === 0) return { matched: db_computeGroupStats([]), rest: db_computeGroupStats(entries) };
    const matched = entries.filter(e => db_matchesAllChips(e, chips));
    const rest = entries.filter(e => !db_matchesAllChips(e, chips));
    return { matched: db_computeGroupStats(matched), rest: db_computeGroupStats(rest) };
  }

  // --- Streak Explorer (Point & Investigate, streak case) ---
  function db_findStreaks(minLen) {
    const outcomeEntries = bt_sortByDate(dbEntries.filter(e => e.outcome === 'win' || e.outcome === 'loss'));
    let streaks = [];
    let i = 0;
    while (i < outcomeEntries.length) {
      let j = i;
      const type = outcomeEntries[i].outcome;
      while (j < outcomeEntries.length && outcomeEntries[j].outcome === type) j++;
      const len = j - i;
      if (len >= minLen) {
        streaks.push({ type, length: len, entries: outcomeEntries.slice(i,j), startDate: outcomeEntries[i].date, endDate: outcomeEntries[j-1].date });
      }
      i = j;
    }
    return streaks.reverse();
  }

  function db_instrumentAvgAbsChange(inst) {
    const candles = db_sortCandles(inst);
    if (candles.length < 2) return null;
    let sum = 0, n = 0;
    for (let i=1;i<candles.length;i++) {
      if (candles[i-1].close) { sum += Math.abs((candles[i].close-candles[i-1].close)/candles[i-1].close*100); n++; }
    }
    return n ? sum/n : null;
  }

  function db_computeInstrumentStats(inst) {
    const candles = db_sortCandles(inst);
    if (candles.length === 0) return { total: 0 };
    const first = candles[0], last = candles[candles.length-1];
    const totalChangePct = first.close ? ((last.close-first.close)/first.close*100) : null;
    let peak = -Infinity, maxDD = 0, ddStart = null, worstDDStart = null, worstDDDays = 0, inDD = false, ddDayCount = 0;
    candles.forEach(c => {
      if (c.close > peak) { peak = c.close; if (inDD) { inDD = false; } ddDayCount = 0; }
      const dd = peak ? (c.close-peak)/peak*100 : 0;
      if (dd < 0) { ddDayCount++; if (!inDD) { inDD = true; ddStart = c.date; } if (dd < maxDD) { maxDD = dd; worstDDStart = ddStart; worstDDDays = ddDayCount; } }
    });
    const recent = candles.slice(-20);
    let vol = null;
    if (recent.length >= 2) {
      const changes = [];
      for (let i=1;i<recent.length;i++) if (recent[i-1].close) changes.push((recent[i].close-recent[i-1].close)/recent[i-1].close*100);
      if (changes.length) {
        const mean = changes.reduce((a,b)=>a+b,0)/changes.length;
        const variance = changes.reduce((a,b)=>a+(b-mean)*(b-mean),0)/changes.length;
        vol = Math.sqrt(variance);
      }
    }
    let bubbleFlag = false;
    if (candles.length >= 20) {
      const last20 = candles.slice(-20);
      const ma = last20.reduce((a,c)=>a+c.close,0)/last20.length;
      if (ma && last.close > ma*1.2) bubbleFlag = true;
    }
    return { total: candles.length, firstDate: first.date, lastDate: last.date, totalChangePct, maxDD, worstDDDays, vol, bubbleFlag, lastClose: last.close };
  }

  function db_addCandle(instId) {
    const inst = db_findInstrument(instId);
    const date = document.getElementById('dbCandleDate').value;
    const open = parseFloat(document.getElementById('dbCandleOpen').value);
    const high = parseFloat(document.getElementById('dbCandleHigh').value);
    const low = parseFloat(document.getElementById('dbCandleLow').value);
    const close = parseFloat(document.getElementById('dbCandleClose').value);
    if (!date || isNaN(close)) { alert('At minimum, a date and close price are required.'); return; }
    const existing = inst.candles.find(c => c.date === date);
    if (existing) { Object.assign(existing, {open,high,low,close}); }
    else inst.candles.push({date, open, high, low, close});
    db_saveInstruments();

    // Notable-day auto-flag
    const sorted = db_sortCandles(inst);
    const idx = sorted.findIndex(c => c.date === date);
    if (idx > 0) {
      const prev = sorted[idx-1];
      if (prev.close) {
        const changePct = (close-prev.close)/prev.close*100;
        const avgAbs = db_instrumentAvgAbsChange(inst);
        if (avgAbs && Math.abs(changePct) > avgAbs*2.5) {
          dbState.notableFlag = { instName: inst.name, date, changePct };
        }
      }
    }
    ['dbCandleOpen','dbCandleHigh','dbCandleLow','dbCandleClose'].forEach(id => { const el=document.getElementById(id); if(el) el.value=''; });
    db_render();
  }

  function db_bulkImportCandles(instId) {
    const inst = db_findInstrument(instId);
    const raw = document.getElementById('dbCandleBulk').value.trim();
    if (!raw) return;
    const lines = raw.split('\n').map(l=>l.trim()).filter(l=>l);
    let added = 0, skipped = 0;
    lines.forEach(line => {
      const parts = line.split(',').map(p=>p.trim());
      if (parts.length < 2) { skipped++; return; }
      const [date, open, high, low, close] = parts;
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { skipped++; return; }
      const c = close !== undefined ? parseFloat(close) : parseFloat(open);
      if (isNaN(c)) { skipped++; return; }
      const existing = inst.candles.find(x => x.date === date);
      const row = { date, open: parseFloat(open)||c, high: parseFloat(high)||c, low: parseFloat(low)||c, close: c };
      if (existing) Object.assign(existing, row); else inst.candles.push(row);
      added++;
    });
    db_saveInstruments();
    document.getElementById('dbCandleBulk').value = '';
    alert(`Imported ${added} candle${added!==1?'s':''}${skipped?`, skipped ${skipped} invalid row${skipped!==1?'s':''}`:''}.`);
    db_render();
  }

    if (n < 30) return `Based on ${n} test results — a reasonable early sample, but still worth more data before fully trusting the exact numbers.`;

  function db_renderTestResultsStats(h, results, title) {
    if (results.length === 0) return `<div class="bt-note">No test results in this category yet.</div>`;
    const sorted = bt_sortByDate(results);
    const m = bt_computeMetrics(sorted);
    const extras = db_testExtras(results);
    const costR = parseFloat(h.estCostPerTradeR);
    const netExpectancy = !isNaN(costR) ? m.expectancy - costR : null;
    let html = `<div class="bt-note" style="font-weight:600;color:inherit;">${title}</div>`;

  // --- Version diff ("what changed") ---
  function db_versionDiff(oldSnap, newSnap) {
    const diffs = [];
    DB_HYP_RULE_FIELDS.forEach(([f,l]) => {
      if ((oldSnap[f]||'') !== (newSnap[f]||'')) diffs.push({ label: l, from: oldSnap[f]||'(empty)', to: newSnap[f]||'(empty)' });
    });
    return diffs;
  }

  // --- Duplicate observation detection ---
  function db_findSimilarEntry(text, excludeId) {
    const norm = (text||'').toLowerCase().replace(/[^\w\s]/g,'').trim();
    if (!norm || norm.length < 8) return null;
    const words = new Set(norm.split(/\s+/).filter(w=>w.length>3));
    if (words.size === 0) return null;
    let best = null, bestScore = 0;
    dbEntries.forEach(e => {
      if (e.id === excludeId) return;
      const eNorm = (e.text||'').toLowerCase().replace(/[^\w\s]/g,'').trim();
      const eWords = new Set(eNorm.split(/\s+/).filter(w=>w.length>3));
      if (eWords.size === 0) return;
      let overlap = 0;
      words.forEach(w => { if (eWords.has(w)) overlap++; });
      const score = overlap / Math.max(words.size, eWords.size);
      if (score > bestScore) { bestScore = score; best = e; }
    });
    return bestScore >= 0.6 ? best : null;
  }

  // --- Full Data Bank backup/export ---
  function db_downloadBackup() {
    const backup = {
      exportedAt: new Date().toISOString(),
      entries: dbEntries, glossary: dbGlossary, events: dbEvents, templates: dbTemplates,
      groups: dbGroups, instruments: dbInstruments, metrics: dbMetrics, hypotheses: dbHypotheses
    };
    const blob = new Blob([JSON.stringify(backup,null,2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'data-bank-backup-' + new Date().toISOString().slice(0,10) + '.json';
    a.click(); URL.revokeObjectURL(url);
  }
  function db_restoreBackupFile(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const backup = JSON.parse(e.target.result);
        if (!backup.entries) throw new Error('Not a valid Data Bank backup file');
        if (!confirm(`This backup has ${backup.entries.length} entries and ${(backup.hypotheses||[]).length} hypotheses. Restoring will REPLACE all current Data Bank data. Continue?`)) return;
        dbEntries = backup.entries||[]; dbGlossary = backup.glossary||[]; dbEvents = backup.events||[];
        dbTemplates = backup.templates||[]; dbGroups = backup.groups||[]; dbInstruments = backup.instruments||[];
        dbMetrics = backup.metrics||[]; dbHypotheses = backup.hypotheses||[];
        db_save(); db_saveGlossary(); db_saveEvents(); db_saveTemplates(); db_saveGroups(); db_saveInstruments(); db_saveMetrics(); db_saveHypotheses();
        alert('Data Bank backup restored.');
        dbState.view = 'home';
        db_render();
      } catch (err) { alert('Could not read this file as a valid Data Bank backup: ' + err.message); }
    };
    reader.readAsText(file);
  }

    const h = db_findHypothesis(hypId);
    const blob = new Blob([JSON.stringify(h,null,2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `hypothesis-${h.name.replace(/\s+/g,'_')}.json`;
    a.click(); URL.revokeObjectURL(url);
  }

  // --- Search ---
  function db_searchAll(query) {
    const q = query.trim().toLowerCase();
    if (!q) return { entries: [], glossary: [], events: [] };
    const entries = dbEntries.filter(e => {
      const hay = [e.text, e.subject, e.number, (e.tags||[]).join(' ')].join(' ').toLowerCase();
      return hay.includes(q);

    const glossary = dbGlossary.filter(g => (g.term+' '+g.definition).toLowerCase().includes(q));
    const events = dbEvents.filter(ev => (ev.name+' '+ev.notes).toLowerCase().includes(q));
    return { entries, glossary, events };

  // ============ PHASE 5: INSIGHTS & HABIT FEATURES ============
  function db_generateInsights(entries) {
    const insights = [];
    const total = entries.length;
    if (total === 0) return insights;

    if (total < 10) {
      insights.push({ text: `${total} entr${total!==1?'ies':'y'} logged. Patterns won't start being meaningful until you have at least 10-15 — keep going.`, tone: 'neutral' });
    } else if (total < 20) {
      insights.push({ text: `${total} entries logged — early signals may be starting to show, still too soon to trust fully.`, tone: 'caution' });
    } else {
      insights.push({ text: `${total} entries logged — enough to start drawing tentative conclusions from the strongest patterns below.`, tone: 'good' });
    }

    const overall = db_computeGroupStats(entries);
    const fieldChecks = [];
    DB_CONDITION_FIELDS.forEach(([field, label]) => {
      const values = db_distinctValues(entries, field);
      values.forEach(v => {
        const present = entries.filter(e => db_hasCondValue(e, field, v));
        if (present.length < 5) return;
        const mp = db_computeGroupStats(present);
        if (mp.rCount >= 3 && overall.rCount >= 3) {
          const expDelta = mp.expectancy - overall.expectancy;
          if (Math.abs(expDelta) >= 0.3) {
            fieldChecks.push({ magnitude: Math.abs(expDelta), text: `${label} = "${v}": ${bt_fmtR(mp.expectancy)}/entry over ${present.length} entries (overall: ${bt_fmtR(overall.expectancy)})`, tone: present.length>=15?(expDelta>0?'good':'warn'):'caution' });
          }
        }
        if (mp.avgNum !== null && overall.avgNum !== null) {
          const numDelta = mp.avgNum - overall.avgNum;
          if (Math.abs(numDelta) >= Math.abs(overall.avgNum)*0.3 && Math.abs(numDelta) > 0.01) {
            fieldChecks.push({ magnitude: Math.abs(numDelta), text: `${label} = "${v}": average number ${mp.avgNum.toFixed(2)} over ${present.length} entries (overall average: ${overall.avgNum.toFixed(2)})`, tone: present.length>=15?'good':'caution' });
          }
        }
      });
    });
    fieldChecks.sort((a,b)=>b.magnitude-a.magnitude);
    fieldChecks.slice(0,4).forEach(f => insights.push({ text: f.text, tone: f.tone }));

    if (total >= 10) {
      DB_CONDITION_FIELDS.forEach(([field, label]) => {
        if (db_distinctValues(entries, field).length === 0) {
          insights.push({ text: `You haven't used ${label} on any entry yet — adding it could reveal patterns you can't see now.`, tone: 'neutral' });
        }
      });
    }

    const tagCounts = {}, pairCounts = {};
    entries.forEach(e => {
      const tags = e.tags||[];
      tags.forEach(t => { tagCounts[t] = (tagCounts[t]||0)+1; });
      for (let i=0;i<tags.length;i++) for (let j=i+1;j<tags.length;j++) {
        const key = [tags[i],tags[j]].sort().join(' + ');
        pairCounts[key] = (pairCounts[key]||0)+1;
      }
    });
    Object.keys(pairCounts).forEach(key => {
      const [a,b] = key.split(' + ');
      const co = pairCounts[key];
      if (co >= 5 && co >= Math.min(tagCounts[a]||0, tagCounts[b]||0)*0.9) {
        insights.push({ text: `"${a}" and "${b}" almost always appear together (${co} entries) — hard to tell which one matters. Try logging a few with just one.`, tone: 'caution' });
      }
    });

    const recentStreaks = db_findStreaks(3).slice(0,1);
    if (recentStreaks.length > 0) {
      const s = recentStreaks[0];
      insights.push({ text: `Most recent streak: ${s.length} ${s.type}s in a row (${s.startDate} → ${s.endDate}). Check the Streaks tab in Analytics to see what it shares.`, tone: s.type==='win'?'good':'warn' });
    }

    return insights;
  }

  function db_recurringWatchlist(limit) {
    const tagCounts = {};
    dbEntries.forEach(e => (e.tags||[]).forEach(t => { tagCounts[t] = (tagCounts[t]||0)+1; }));
    return Object.entries(tagCounts).sort((a,b)=>b[1]-a[1]).slice(0, limit||5);
  }

    let html = `<div class="bt-card"><h3>☁️ Today</h3>`;

      const up = todayEntries.filter(e=>e.direction==='up').length;
      const down = todayEntries.filter(e=>e.direction==='down').length;
      const tags = Array.from(new Set(todayEntries.flatMap(e=>e.tags||[])));
      html += `<div class="bt-note">${todayEntries.length} entr${todayEntries.length!==1?'ies':'y'} logged · ▲${up} ▼${down}${tags.length?` · tagged: ${tags.map(t=>bt_esc(t)).join(', ')}`:''}</div>`;
    }
    todayCandles.forEach(tc => {
      html += `<div class="bt-note">📈 ${bt_esc(tc.name)}: close ${tc.c.close}</div>`;

    const weekEntries = dbEntries.filter(e => e.date >= weekAgoStr);

    weekEntries.forEach(e => (e.tags||[]).forEach(t => { tagCounts[t] = (tagCounts[t]||0)+1; }));
    const topTag = Object.entries(tagCounts).sort((a,b)=>b[1]-a[1])[0];

    const md = String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');

  function db_spotCheckHtml() {
    const todayStr = new Date().toISOString().slice(0,10);
    const lastShown = localStorage.getItem('dbLastSpotCheck');
    if (lastShown === todayStr) return '';
    if (dbEntries.length < 10) return '';
    const candidates = dbEntries.filter(e => e.date !== todayStr);
    if (candidates.length === 0) return '';
    const picks = [];
    const pool = candidates.slice();
    for (let i=0;i<Math.min(2,pool.length);i++) {
      const idx = Math.floor(Math.random()*pool.length);
      picks.push(pool.splice(idx,1)[0]);
    }
    let html = `<div class="bt-card"><h3>Quick Spot-Check</h3><div class="bt-note">Does this old data still look right to you?</div>`;
    picks.forEach(e => { html += db_entryRowHtml(e); });
    html += `<button class="bt-tab" onclick="db_dismissSpotCheck()">Looks fine — dismiss</button></div>`;
    return html;
  }

  function db_renderReviewEntryView() {
    const d = dbState.draft;
    let html = `<button class="bt-tab" onclick="db_backToEditEntry()">← Back to Edit</button>`;
    html += `<div class="bt-card"><h3>Review Before Saving</h3>
      <div class="bt-note">One more look — this is what's about to be saved.</div>
      <div class="bt-trade-row"><span>Date</span><span>${bt_esc(d.date)}</span></div>
      ${d.subject?`<div class="bt-trade-row"><span>Subject</span><span>${bt_esc(d.subject)}</span></div>`:''}
      ${d.text?`<div class="bt-trade-row" style="flex-direction:column;align-items:stretch;"><span style="font-weight:600;">What happened</span><span>${bt_esc(d.text)}</span></div>`:''}
      ${d.number?`<div class="bt-trade-row"><span>Number</span><span>${bt_esc(d.number)}${d.unit!=='other'?bt_esc(d.unit):''}</span></div>`:''}
      ${d.direction?`<div class="bt-trade-row"><span>Direction</span><span>${d.direction}</span></div>`:''}

      ${d.outcome?`<div class="bt-trade-row"><span>Outcome</span><span>${d.outcome}${d.resultR?' ('+d.resultR+'R)':''}</span></div>`:''}
      ${d.confidence?`<div class="bt-trade-row"><span>How sure</span><span>${d.confidence}</span></div>`:''}
    </div>`;

    const warnings = db_entrySanityWarnings(d);
    if (warnings.length > 0) {
      warnings.forEach(w => { html += `<div class="bt-warn">⚠ ${w}</div>`; });
    }
    if (!d.confidence) {
      html += `<div class="bt-warn">You haven't marked how sure you are of this data (Verified / Estimated / Rough Guess) — go back and set it if you want this to count toward your data-quality score.</div>`;
    }
    const newTags = d.tags.filter(t => !dbGlossary.some(g=>g.term.toLowerCase()===t.toLowerCase()));
    if (newTags.length > 0) {
      html += `<div class="bt-warn">New tag${newTags.length!==1?'s':''} not yet in your Notes glossary: ${newTags.map(t=>bt_esc(t)).join(', ')}. Worth adding a definition so it stays consistent later.</div>`;
    }
    const similar = db_findSimilarEntry(d.text, null);
    if (similar) {
      html += `<div class="bt-warn">You may already have a related observation (${bt_esc(similar.date)}): "${bt_esc(similar.text.slice(0,80))}". You can still save this as a separate entry — just flagging it.</div>`;
    }

    html += `<div class="bt-row-btns">
      <button class="bt-btn-primary" style="flex:2;" onclick="db_confirmSaveEntry()">Confirm & Save</button>
      <button onclick="db_backToEditEntry()">Edit</button>
    </div>`;
    return html;
  }

  function db_renderCalendarView() {
    let html = `<button class="bt-tab" onclick="dbState.view='home'; db_render();">← Back</button>`;
    const m = dbState.calMonth;
    const year = m.getFullYear(), month = m.getMonth();
    const firstDay = new Date(year, month, 1);
    const startWeekday = firstDay.getDay();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const countsByDate = {};
    dbEntries.forEach(e => { countsByDate[e.date] = (countsByDate[e.date]||0) + 1; });
    const todayStr = new Date().toISOString().slice(0,10);

    html += `<div class="bt-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <button class="bt-tab" onclick="db_changeCalMonth(-1)">‹ Prev</button>
        <h3 style="margin:0;">${firstDay.toLocaleString('default',{month:'long',year:'numeric'})}</h3>
        <button class="bt-tab" onclick="db_changeCalMonth(1)">Next ›</button>
      </div>
      <div class="db-cal-grid">`;
    ['S','M','T','W','T','F','S'].forEach(d => { html += `<div style="text-align:center;font-size:10px;color:var(--text-dim);">${d}</div>`; });
    for (let i=0;i<startWeekday;i++) html += `<div></div>`;
    for (let day=1; day<=daysInMonth; day++) {
      const ds = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const count = countsByDate[ds] || 0;
      html += `<div class="db-cal-cell ${count>0?'has-entries':''} ${ds===todayStr?'today':''}" onclick="db_selectCalDate('${ds}')">
        <div>${day}</div>${count>0?`<div class="n">${count}</div>`:''}
      </div>`;
    }
    html += `</div></div>`;

    if (dbState.calSelectedDate) {
      const dayEntries = dbEntries.filter(e => e.date === dbState.calSelectedDate);
      html += `<div class="bt-card"><h3>${bt_esc(dbState.calSelectedDate)}</h3>`;
      if (dayEntries.length === 0) html += '<div class="bt-note">No entries this day.</div>';
      else dayEntries.forEach(e => { html += db_entryRowHtml(e); });
      html += '</div>';
    }
    return html;
  }

  function db_dataQualityScore() {
    const total = dbEntries.length;
    if (total === 0) return null;
    const withConfidence = dbEntries.filter(e => e.confidence).length;
    const withTags = dbEntries.filter(e => (e.tags||[]).length > 0).length;
    const withSubject = dbEntries.filter(e => e.subject && e.subject.trim()).length;
    const verified = dbEntries.filter(e => e.confidence === 'verified').length;
    const rough = dbEntries.filter(e => e.confidence === 'rough').length;
    return {
      total,
      confidencePct: withConfidence/total*100,
      tagsPct: withTags/total*100,
      subjectPct: withSubject/total*100,
      verifiedPct: withConfidence ? verified/withConfidence*100 : null,
      roughPct: withConfidence ? rough/withConfidence*100 : null
    };
  }

  function db_qualityScoreCardHtml() {
    const q = db_dataQualityScore();
    if (!q) return '';
    return `<div class="bt-card"><h3>Data Quality</h3>
      <div class="bt-metric-grid">
        <div class="bt-metric-box ${q.confidencePct>=70?'tone-good':q.confidencePct>=40?'tone-caution':'tone-warn'}"><div class="v">${q.confidencePct.toFixed(0)}%</div><div class="l">Marked How Sure</div></div>
        <div class="bt-metric-box ${q.tagsPct>=70?'tone-good':''}"><div class="v">${q.tagsPct.toFixed(0)}%</div><div class="l">Have Tags</div></div>
        <div class="bt-metric-box"><div class="v">${q.subjectPct.toFixed(0)}%</div><div class="l">Have Subject</div></div>
        <div class="bt-metric-box ${q.roughPct!==null&&q.roughPct>=30?'tone-warn':''}"><div class="v">${q.roughPct===null?'—':q.roughPct.toFixed(0)+'%'}</div><div class="l">Marked Rough Guess</div></div>
      </div>
      <div class="bt-note">An honest picture of how solid your own data is — not a score to chase, just something to keep an eye on.</div>
    </div>`;
  }

  function db_statsCardHtml(title, s) {
    if (!s.total) return `<div class="bt-card"><h3>${title}</h3><div class="bt-note">No entries in this group.</div></div>`;
    const expTone = s.expectancy>0?'tone-good':s.expectancy<0?'tone-warn':'';
    return `<div class="bt-card"><h3>${title}</h3>
      ${s.rCount>0?`<div class="bt-hero"><div class="hv ${expTone}">${bt_fmtR(s.expectancy)}</div><div class="hl">Expectancy / Entry</div></div>`:''}
      <div class="bt-metric-grid">
        <div class="bt-metric-box"><div class="v">${s.total}</div><div class="l">Entries</div></div>
        <div class="bt-metric-box"><div class="v">${s.winRate===null?'—':bt_fmtPct(s.winRate)}</div><div class="l">Win Rate</div></div>
        <div class="bt-metric-box"><div class="v">${s.avgNum===null?'—':s.avgNum.toFixed(2)}</div><div class="l">Avg Number</div></div>
        <div class="bt-metric-box"><div class="v">▲${s.up} ▼${s.down} ●${s.neutral}</div><div class="l">Direction Split</div></div>
      </div>
    </div>`;
  }

  function db_renderAnalyticsView() {
    let html = `<button class="bt-tab" onclick="dbState.view='home'; db_render();">← Back</button>`;
    if (dbEntries.length === 0) {
      html += '<div class="bt-card"><h3>Analytics</h3><div class="bt-note">Log a few entries first — analytics will populate as you go.</div></div>';
      return html;
    }
    const tabs = [['overview','Overview'],['compare','Compare'],['streaks','Streaks'],['groups','Saved Groups']];
    html += `<div class="bt-tab-row">`;
    tabs.forEach(([k,l]) => { html += `<button class="bt-tab ${dbState.anaTab===k?'on':''}" onclick="db_setAnaTab('${k}')">${l}</button>`; });
    html += '</div>';

    if (dbState.anaTab === 'overview') {
      html += db_statsCardHtml('All Entries', db_computeGroupStats(dbEntries));
      html += db_qualityScoreCardHtml();
    }

    if (dbState.anaTab === 'compare') {
      html += `<div class="bt-card"><h3>Multi-Condition Comparison</h3>
        <div class="bt-note">Stack conditions with AND logic — e.g. Tag=risk-off AND Direction=down. Watch the sample size as you add more.</div>`;
      if (dbState.condChips.length > 0) {
        html += `<label class="bt-field-label">Active conditions</label><div class="bt-pill-row">`;
        dbState.condChips.forEach((c,i) => {
          const fLabel = DB_CONDITION_FIELDS.find(f=>f[0]===c.field)[1];
          html += `<button class="bt-pill on" onclick="db_removeCondChip(${i})">${fLabel}=${bt_esc(c.value)} ✕</button>`;
        });
        html += `</div><div class="bt-row-btns">
          <button onclick="db_clearCondChips()">Clear All</button>
          <button class="bt-btn-primary" onclick="db_saveGroupFromChips()">Save as Group</button>
        </div>`;
      }
      html += `<label class="bt-field-label" style="margin-top:8px;">Add a condition — field</label><div class="bt-pill-row">`;
      DB_CONDITION_FIELDS.forEach(([k,l]) => { html += `<button class="bt-pill ${dbState.condField===k?'on':''}" onclick="db_setCondField('${k}')">${l}</button>`; });
      html += '</div>';
      const values = db_distinctValues(dbEntries, dbState.condField);
      if (values.length === 0) {
        html += '<div class="bt-note">No entries have this field set yet.</div>';
      } else {
        html += `<label class="bt-field-label">Value</label><div class="bt-pill-row">`;
        values.forEach(v => { html += `<button class="bt-pill ${dbState.condValue===v?'on':''}" onclick="db_setCondValue('${bt_esc(v)}')">${bt_esc(v)}</button>`; });
        html += '</div>';
        html += `<button class="bt-btn-primary" style="width:100%;padding:8px;border:none;border-radius:8px;" onclick="db_addCondChip()">+ Add This Condition</button>`;
      }
      html += '</div>';

      if (dbState.condChips.length > 0) {
        const cmp = db_multiConditionCompare(dbEntries, dbState.condChips);
        const warn = bt_sampleSizeWarning(cmp.matched.total, dbState.condChips.length);
        html += `<div class="${warn.tone==='warn'?'bt-warn':'bt-note'}">${warn.text}</div>`;
        html += `<div class="bt-compare-cols">
          <div class="bt-compare-col"><h4>MATCHES ALL</h4>
            <div class="m"><span>Entries</span><span>${cmp.matched.total||0}</span></div>
            <div class="m"><span>Win Rate</span><span>${cmp.matched.total&&cmp.matched.winRate!==null?bt_fmtPct(cmp.matched.winRate):'—'}</span></div>
            <div class="m"><span>Expectancy</span><span>${cmp.matched.total&&cmp.matched.rCount?bt_fmtR(cmp.matched.expectancy):'—'}</span></div>
            <div class="m"><span>Avg Number</span><span>${cmp.matched.total&&cmp.matched.avgNum!==null?cmp.matched.avgNum.toFixed(2):'—'}</span></div>
          </div>
          <div class="bt-compare-col"><h4>EVERYTHING ELSE</h4>
            <div class="m"><span>Entries</span><span>${cmp.rest.total||0}</span></div>
            <div class="m"><span>Win Rate</span><span>${cmp.rest.total&&cmp.rest.winRate!==null?bt_fmtPct(cmp.rest.winRate):'—'}</span></div>
            <div class="m"><span>Expectancy</span><span>${cmp.rest.total&&cmp.rest.rCount?bt_fmtR(cmp.rest.expectancy):'—'}</span></div>
            <div class="m"><span>Avg Number</span><span>${cmp.rest.total&&cmp.rest.avgNum!==null?cmp.rest.avgNum.toFixed(2):'—'}</span></div>
          </div>
        </div>`;
      }

      if (dbGroups.length >= 2) {
        html += `<div class="bt-card"><h3>Group vs Group</h3>
          <label class="bt-field-label">Group A</label>
          <select class="bt-select" onchange="db_setCompareGroupA(this.value)">
            <option value="">—</option>
            ${dbGroups.map(g=>`<option value="${g.id}" ${dbState.compareGroupA===g.id?'selected':''}>${bt_esc(g.name)}</option>`).join('')}
          </select>
          <label class="bt-field-label">Group B</label>
          <select class="bt-select" onchange="db_setCompareGroupB(this.value)">
            <option value="">—</option>
            ${dbGroups.map(g=>`<option value="${g.id}" ${dbState.compareGroupB===g.id?'selected':''}>${bt_esc(g.name)}</option>`).join('')}
          </select>`;
        if (dbState.compareGroupA && dbState.compareGroupB) {
          const gA = dbGroups.find(g=>g.id===dbState.compareGroupA);
          const gB = dbGroups.find(g=>g.id===dbState.compareGroupB);
          const sA = db_computeGroupStats(dbEntries.filter(e=>db_matchesAllChips(e,gA.chips)));
          const sB = db_computeGroupStats(dbEntries.filter(e=>db_matchesAllChips(e,gB.chips)));
          html += `<div class="bt-compare-cols">
            <div class="bt-compare-col"><h4>${bt_esc(gA.name).toUpperCase()}</h4>
              <div class="m"><span>Entries</span><span>${sA.total||0}</span></div>
              <div class="m"><span>Win Rate</span><span>${sA.total&&sA.winRate!==null?bt_fmtPct(sA.winRate):'—'}</span></div>
              <div class="m"><span>Expectancy</span><span>${sA.total&&sA.rCount?bt_fmtR(sA.expectancy):'—'}</span></div>
            </div>
            <div class="bt-compare-col"><h4>${bt_esc(gB.name).toUpperCase()}</h4>
              <div class="m"><span>Entries</span><span>${sB.total||0}</span></div>
              <div class="m"><span>Win Rate</span><span>${sB.total&&sB.winRate!==null?bt_fmtPct(sB.winRate):'—'}</span></div>
              <div class="m"><span>Expectancy</span><span>${sB.total&&sB.rCount?bt_fmtR(sB.expectancy):'—'}</span></div>
            </div>
          </div>`;
        }
        html += '</div>';
      }
    }

    if (dbState.anaTab === 'streaks') {
      html += `<div class="bt-card"><h3>Streak Explorer</h3>
        <div class="bt-note">Point at any streak length and see exactly which entries made it up — win streaks and loss streaks, found automatically.</div>
        <label class="bt-field-label">Minimum streak length to show</label>
        <input class="bt-input" type="number" min="2" value="${dbState.streakMinLen}" onchange="db_setStreakMinLen(this.value)">
      </div>`;
      const streaks = db_findStreaks(dbState.streakMinLen);
      if (streaks.length === 0) {
        html += `<div class="bt-note">No streaks of ${dbState.streakMinLen}+ found yet — log more outcome-tagged entries, or lower the minimum.</div>`;
      } else {
        streaks.forEach((s, idx) => {
          const isOpen = dbState.expandedStreakIdx === idx;
          html += `<div class="bt-card" style="cursor:pointer;" onclick="db_toggleStreakExpand(${idx})">
            <h3>${s.type==='win'?'✅':'❌'} ${s.length}-${s.type} streak</h3>
            <div class="meta">${bt_esc(s.startDate)} → ${bt_esc(s.endDate)}</div>`;
          if (isOpen) {
            const rest = dbEntries.filter(e => !s.entries.includes(e));
            const sStats = db_computeGroupStats(s.entries);
            const restStats = db_computeGroupStats(rest);
            html += `<div onclick="event.stopPropagation()">`;
            s.entries.forEach(e => { html += db_entryRowHtml(e); });
            html += `<div class="bt-field-label" style="margin-top:10px;">What this streak shares, vs everything else</div>
              <div class="bt-compare-cols">
                <div class="bt-compare-col"><h4>THIS STREAK</h4>
                  <div class="m"><span>Entries</span><span>${sStats.total}</span></div>
                  <div class="m"><span>Avg Number</span><span>${sStats.avgNum!==null?sStats.avgNum.toFixed(2):'—'}</span></div>
                  <div class="m"><span>Direction</span><span>▲${sStats.up} ▼${sStats.down}</span></div>
                </div>
                <div class="bt-compare-col"><h4>EVERYTHING ELSE</h4>
                  <div class="m"><span>Entries</span><span>${restStats.total}</span></div>
                  <div class="m"><span>Avg Number</span><span>${restStats.avgNum!==null?restStats.avgNum.toFixed(2):'—'}</span></div>
                  <div class="m"><span>Direction</span><span>▲${restStats.up} ▼${restStats.down}</span></div>
                </div>
              </div></div>`;
          }
          html += '</div>';
        });
      }
    }

    if (dbState.anaTab === 'groups') {
      html += `<div class="bt-card"><h3>Saved Groups</h3>
        <div class="bt-note">Build conditions on the Compare tab, then save them here as a reusable named group.</div>`;
      if (dbGroups.length === 0) {
        html += '<div class="bt-note">No saved groups yet.</div>';
      } else {
        dbGroups.forEach(g => {
          const stats = db_computeGroupStats(dbEntries.filter(e=>db_matchesAllChips(e,g.chips)));
          html += `<div class="bt-trade-row" style="flex-direction:column;align-items:stretch;">
            <div style="display:flex;justify-content:space-between;">
              <span><b>${bt_esc(g.name)}</b></span>
              <span>${stats.total} entries</span>
            </div>
            <div style="font-size:11px;color:var(--text-dim);">${g.chips.map(c=>DB_CONDITION_FIELDS.find(f=>f[0]===c.field)[1]+'='+bt_esc(c.value)).join(' AND ')}</div>
            <div class="bt-row-btns" style="margin-top:6px;">
              <button class="bt-btn-primary" onclick="db_applyGroup('${g.id}')">Load into Compare</button>
              <button class="bt-btn-danger" onclick="db_deleteGroup('${g.id}')">Delete</button>
            </div>
          </div>`;
        });
      }
      html += '</div>';
    }

    return html;
  }
